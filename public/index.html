<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vernet Ops</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{
  --bg:#0a0908;--bg2:#111009;--bg3:#18160f;--bg4:#201d14;--bg5:#28251a;
  --text:#ede5d0;--text2:#a89878;--text3:#6b5c3e;--text4:#3d3020;
  --border:#201d14;--border2:#2e2a1e;--border3:#3d3828;
  --red:#d94f4f;--red-bg:#1f0f0f;--red-dim:#7a2020;
  --green:#4a9460;--green-bg:#0d1f14;--green-dim:#1e4a2a;
  --blue:#4a80c8;--blue-bg:#0d1520;
  --orange:#c87830;--orange-bg:#1f1408;
  --gold:#c9a84c;--gold-light:#e8c87a;--gold-dim:#8a6e30;--gold-ultra-dim:#2a2010;
  --shadow:0 4px 24px rgba(0,0,0,.5);--shadow-sm:0 2px 8px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#f5f0e8;--bg2:#ffffff;--bg3:#faf7f2;--bg4:#f0ebe0;--bg5:#e8e2d5;
  --text:#1a1510;--text2:#5a4e38;--text3:#8a7a60;--text4:#c0b090;
  --border:#e0d8c8;--border2:#d0c8b5;--border3:#bfb5a0;
  --red:#c03030;--red-bg:#fdf0f0;--red-dim:#f5d0d0;
  --green:#2a7a48;--green-bg:#f0faf4;--green-dim:#c8ecd8;
  --blue:#2a60a8;--blue-bg:#f0f5ff;
  --orange:#a85020;--orange-bg:#fff5ee;
  --gold:#a07820;--gold-light:#c49030;--gold-dim:#8a6e30;--gold-ultra-dim:#f5edd8;
  --shadow:0 4px 24px rgba(0,0,0,.1);--shadow-sm:0 2px 8px rgba(0,0,0,.08);
}
:root{--transition:.2s cubic-bezier(.4,0,.2,1);--r:10px;--r2:14px;--r3:20px;--sidebar-w:230px;--font:'Inter',-apple-system,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#login-screen.hidden{display:none}
.login-wrap{width:100%;max-width:360px;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:40px 36px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .logo-mark{width:52px;height:52px;background:linear-gradient(135deg,var(--gold-dim),var(--gold));border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.login-logo .name{font-size:20px;font-weight:700;color:var(--text)}
.login-logo .sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.login-field input{width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:var(--transition)}
.login-field input:focus{border-color:var(--gold-dim)}
.login-btn{width:100%;padding:12px;background:var(--gold);color:#0a0908;font-weight:700;font-size:14px;border:none;border-radius:var(--r);cursor:pointer;transition:var(--transition);margin-top:6px;font-family:var(--font)}
.login-btn:hover{background:var(--gold-light);transform:translateY(-1px)}
.login-error{color:var(--red);font-size:12px;text-align:center;margin-top:10px;min-height:18px;font-weight:500}
.login-theme{position:absolute;top:16px;right:16px}

/* ── APP LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}
#app.hidden{display:none}
#sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sb-hotel{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user{font-size:11px;color:var(--text3);margin-top:3px}
.sb-badge{display:inline-block;padding:1px 6px;background:var(--gold-ultra-dim);border:1px solid var(--gold-dim);border-radius:8px;font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-section{padding:16px 18px 5px;font-size:10px;font-weight:700;color:var(--text4);letter-spacing:2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:var(--text3);transition:var(--transition);border-left:2px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--gold-ultra-dim);color:var(--gold);border-left-color:var(--gold)}
.nav-item .ico{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-item .lbl{font-size:13px;font-weight:500}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.sb-footer{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.theme-toggle{width:34px;height:34px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:var(--transition);flex-shrink:0}
.theme-toggle:hover{border-color:var(--gold-dim)}
.logout-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);color:var(--text3);cursor:pointer;font-size:12px;font-weight:500;transition:var(--transition);font-family:var(--font)}
.logout-btn:hover{border-color:var(--red-dim);color:var(--red)}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar-title{font-size:15px;font-weight:700;color:var(--text)}
#topbar-date{margin-left:auto;font-size:12px;color:var(--text3);font-weight:500}
#topbar-actions{display:flex;gap:8px}
#content{flex:1;overflow-y:auto;padding:22px}

/* ── COMPONENTS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px;text-align:center;transition:var(--transition)}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.stat-label{font-size:10px;font-weight:600;color:var(--text3);margin-top:6px;letter-spacing:1px;text-transform:uppercase}

.btn{padding:8px 16px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;font-family:var(--font);white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#0a0908}.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--gold-dim);color:var(--text);background:var(--bg3)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-dim)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-green{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-dim)}.btn-green:hover{background:var(--green);color:#fff}
.btn-ghost{background:transparent;border:none;color:var(--text3)}.btn-ghost:hover{color:var(--text);background:var(--bg3)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:var(--transition);font-family:var(--font)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-dim);background:var(--bg4)}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field select option{background:var(--bg3);color:var(--text)}
.fields-row{display:grid;gap:12px}
.fields-row.c2{grid-template-columns:1fr 1fr}
.fields-row.c3{grid-template-columns:1fr 1fr 1fr}
.fields-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}

.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-pending{background:var(--orange-bg);color:var(--orange)}
.badge-approved{background:var(--green-bg);color:var(--green)}
.badge-rejected{background:var(--red-bg);color:var(--red)}
.badge-critical{background:var(--red);color:#fff}
.badge-high{background:var(--red-bg);color:var(--red)}
.badge-medium{background:var(--orange-bg);color:var(--orange)}
.badge-low{background:var(--bg4);color:var(--text3)}
.badge-open{background:var(--blue-bg);color:var(--blue)}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge-in_progress{background:var(--orange-bg);color:var(--orange)}
.badge-super_admin{background:linear-gradient(135deg,var(--gold-dim),var(--gold));color:#0a0908}
.badge-hotel_admin{background:var(--blue-bg);color:var(--blue)}
.badge-chef_service{background:var(--orange-bg);color:var(--orange)}
.badge-equipe{background:var(--bg4);color:var(--text3)}

.list-item{padding:13px 16px;background:var(--bg3);border-radius:var(--r);margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;transition:var(--transition);border:1px solid transparent}
.list-item:hover{background:var(--bg4);border-color:var(--border)}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-item-sub{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
.list-item-meta{font-size:11px;color:var(--text3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list-item-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:var(--transition)}
.modal-overlay.visible{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r3);padding:28px;width:560px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);transform:translateY(8px);transition:var(--transition)}
.modal-overlay.visible .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-title{font-size:16px;font-weight:700;color:var(--gold)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;line-height:1;border-radius:6px;transition:var(--transition)}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}

/* File picker */
.file-picker-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg3);border:2px dashed var(--border2);border-radius:var(--r);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;transition:var(--transition);font-family:var(--font);width:100%;justify-content:center}
.file-picker-btn:hover{border-color:var(--gold-dim);color:var(--text);background:var(--bg4)}
.file-picker-input{display:none}
.files-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
.file-row .ico{font-size:15px;flex-shrink:0}
.file-row .name{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.file-row .sz{font-size:11px;color:var(--text3);flex-shrink:0}

/* Chat */
#chat-container{display:flex;flex-direction:column;height:calc(100vh - 152px);gap:12px}
.chat-channels{display:flex;gap:6px;flex-wrap:wrap}
.channel-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-size:12px;font-weight:600;transition:var(--transition);font-family:var(--font)}
.channel-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.channel-btn.active{background:var(--gold);color:#0a0908;border-color:var(--gold)}
#chat-messages{flex:1;overflow-y:auto;background:var(--bg3);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border)}
.chat-msg{display:flex;flex-direction:column;max-width:75%}
.chat-msg.own{align-self:flex-end;align-items:flex-end}
.chat-bubble{padding:9px 13px;border-radius:14px;background:var(--bg4);font-size:13px;line-height:1.5;border:1px solid var(--border)}
.chat-msg.own .chat-bubble{background:var(--gold-ultra-dim);border-color:var(--gold-dim)}
.chat-meta{font-size:10px;color:var(--text3);margin-top:3px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:10px 14px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:var(--transition);font-family:var(--font)}
.chat-input-row input:focus{border-color:var(--gold-dim)}

/* Critical banner */
.critical-banner{background:var(--red-bg);border:1px solid var(--red-dim);border-radius:var(--r);padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.critical-dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
.critical-text{flex:1}
.critical-title{font-size:13px;font-weight:700;color:var(--red)}
.critical-msg{font-size:12px;color:var(--text2);margin-top:2px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;background:var(--bg3);color:var(--text3);font-weight:600;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
.amount{font-weight:700;color:var(--gold);font-family:monospace;font-size:13px}

/* Filter bar */
.filter-bar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2)}
.filter-bar .field{margin:0;min-width:120px}
.filter-bar .field input,.filter-bar .field select{padding:7px 10px;font-size:12px}
.filter-bar .field label{font-size:10px;margin-bottom:4px}
.search-input{flex:1;min-width:160px;padding:7px 12px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;font-family:var(--font);transition:var(--transition)}
.search-input:focus{border-color:var(--gold-dim)}
.search-input::placeholder{color:var(--text3)}

/* Calendar */
.cal-layout{display:flex;gap:16px;height:calc(100vh - 160px)}
.cal-grid-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-month-title{font-size:16px;font-weight:700;color:var(--text);flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1}
.cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;padding:6px 0;text-transform:uppercase}
.cal-day{background:var(--bg3);border-radius:8px;padding:6px;cursor:pointer;transition:var(--transition);border:1.5px solid transparent;min-height:56px;display:flex;flex-direction:column}
.cal-day:hover{background:var(--bg4);border-color:var(--border2)}
.cal-day.today{border-color:var(--gold-dim)!important;background:var(--gold-ultra-dim)}
.cal-day.selected{border-color:var(--gold)!important;background:var(--gold-ultra-dim)}
.cal-day.other-month{opacity:.35}
.cal-day.other-month:hover{opacity:.55}
.cal-day-num{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.cal-day.today .cal-day-num{color:var(--gold);font-weight:700}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-dot-matin{background:#f0a030}
.cal-dot-apres_midi{background:#4a80c8}
.cal-dot-nuit{background:#6a5090}
.svc-reception{border-left-color:#4a80c8!important}
.svc-housekeeping{border-left-color:#4a9460!important}
.svc-fb{border-left-color:#c87830!important}
.svc-maintenance{border-left-color:#d94f4f!important}
.svc-direction{border-left-color:#c9a84c!important}
.svc-general{border-left-color:#6b5c3e!important}
.alert-notif-bar{position:fixed;top:0;left:0;right:0;z-index:500;background:var(--red);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;animation:slide-down .3s ease;box-shadow:0 4px 16px rgba(217,79,79,.4)}
@keyframes slide-down{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.alert-notif-bar button{margin-left:auto;background:rgba(255,255,255,.25);border:none;color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.cal-day-count{font-size:10px;color:var(--text3);margin-top:2px}

.cal-panel{width:320px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;overflow:hidden}
.cal-panel-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cal-panel-title{font-size:13px;font-weight:700;color:var(--text)}
.cal-panel-body{flex:1;overflow-y:auto;padding:12px}
.cal-panel-footer{padding:12px;border-top:1px solid var(--border)}
.ho-item{background:var(--bg3);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--border3)}
.ho-item.shift-matin{border-left-color:#f0a030}
.ho-item.shift-apres_midi{border-left-color:#4a80c8}
.ho-item.shift-nuit{border-left-color:#8a6e30}
.ho-shift-badge{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.ho-content{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.ho-meta{font-size:11px;color:var(--text3);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ho-actions{display:flex;gap:4px;margin-left:auto}

/* Briefing */
#briefing-editor{width:100%;min-height:220px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;line-height:1.8;padding:16px;resize:vertical;outline:none;font-family:var(--font);transition:var(--transition)}
#briefing-editor:focus{border-color:var(--gold-dim)}
.briefing-content{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap}
.briefing-date{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}

/* Settings */
.settings-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg3);padding:4px;border-radius:var(--r);width:fit-content}
.settings-tab{padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text3);transition:var(--transition);border:none;background:transparent;font-family:var(--font)}
.settings-tab.active{background:var(--bg2);color:var(--text);box-shadow:var(--shadow-sm)}
.settings-section{display:none}
.settings-section.active{display:block}
.info-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:12px;color:var(--text3);line-height:1.6}

/* Users */
.user-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;transition:var(--transition);margin-bottom:8px}
.user-card:hover{border-color:var(--border2);background:var(--bg4)}
.user-avatar{width:38px;height:38px;border-radius:10px;background:var(--gold-ultra-dim);border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--gold);flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:var(--text)}
.user-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-inactive{opacity:.5}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 18px;font-size:13px;font-weight:500;color:var(--text);z-index:999;transform:translateY(80px);opacity:0;transition:.3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow);max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:var(--green-dim);color:var(--green)}
#toast.error{border-color:var(--red-dim);color:var(--red)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-ico{font-size:36px;margin-bottom:12px;opacity:.5}
.empty-txt{font-size:14px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;background:var(--bg4);border-radius:20px;font-size:11px;color:var(--text3);border:1px solid var(--border)}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fade-up .3s ease forwards}

#hamburger{display:none;width:34px;height:34px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
#hamburger:hover{border-color:var(--gold-dim)}

@media(max-width:900px){.cal-layout{flex-direction:column}.cal-panel{width:100%;max-height:300px}}
@media(max-width:768px){
  #sidebar{display:none;position:fixed;inset:0 auto 0 0;z-index:150;width:260px;box-shadow:4px 0 20px rgba(0,0,0,.5)}
  #sidebar.open{display:flex}
  .sidebar-overlay{display:none;position:fixed;top:0;left:260px;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:149}
.sidebar-overlay.visible{display:block}
  #hamburger{display:flex}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .fields-row.c2,.fields-row.c3,.fields-row.c4{grid-template-columns:1fr 1fr}
  #content{padding:14px}
  .cal-layout{flex-direction:column}
  .cal-panel{width:100%;max-height:300px}
  .tbl{font-size:11px}
  .tbl th,.tbl td{padding:7px 8px}
}
</style>
</head>
<body>

<div id="login-screen">
  <button class="theme-toggle login-theme" onclick="toggleTheme()">🌙</button>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">🏨</div>
        <div class="name">Vernet Ops</div>
        <div class="sub">B Signature Hôtels &amp; Resorts</div>
      </div>
      <div class="login-field"><label>Identifiant</label><input type="text" id="login-user" autocomplete="username" placeholder="ex: etienne"></div>
      <div class="login-field"><label>Mot de passe</label><input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="login-btn" onclick="doLogin()">Se connecter</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sb-header">
      <div class="sb-hotel" id="sb-hotel">—</div>
      <div class="sb-user" id="sb-user">—</div>
      <div id="sb-badge"></div>
    </div>
    <nav class="sb-nav">
      <div class="nav-section">Opérations</div>
      <div class="nav-item active" onclick="navigate('dashboard')"><span class="ico">◼</span><span class="lbl">Dashboard</span></div>
      <div class="nav-item" onclick="navigate('briefing')"><span class="ico">📋</span><span class="lbl">Briefing</span></div>
      <div class="nav-item" onclick="navigate('alerts')"><span class="ico">🔴</span><span class="lbl">Alertes</span><span class="nav-badge" id="badge-alerts" style="display:none">0</span></div>
      <div class="nav-item" onclick="navigate('announcements')"><span class="ico">📢</span><span class="lbl">Annonces</span></div>
      <div class="nav-item" onclick="navigate('chat')"><span class="ico">💬</span><span class="lbl">Chat</span></div>
      <div class="nav-section">Contrôle</div>
      <div class="nav-item" onclick="navigate('deductions')"><span class="ico">🧾</span><span class="lbl">Déductions</span><span class="nav-badge" id="badge-deductions" style="display:none">0</span></div>
      <div class="nav-item" onclick="navigate('handovers')"><span class="ico">📅</span><span class="lbl">Consignes</span></div>
      <div class="nav-item" onclick="navigate('maintenance')"><span class="ico">🔧</span><span class="lbl">Maintenance</span></div>
      <div class="nav-section">Compte</div>
      <div class="nav-item" onclick="navigate('settings')"><span class="ico">⚙️</span><span class="lbl">Paramètres</span></div>
    </nav>
    <div class="sb-footer">
      <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
<button id="hamburger" onclick="toggleSidebar()">☰</button>
      <div id="topbar-title">Dashboard</div>
      <div id="topbar-date"></div>
      <div id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">—</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let currentUser=null,socket=null,currentPage='dashboard',currentChatService='general';
let currentTheme=localStorage.getItem('theme')||'dark';
let calendarDate=new Date(); // current month shown in calendar
let calendarSelected=null;   // selected day string YYYY-MM-DD
let calendarData={};         // { 'YYYY-MM-DD': [handovers] }
const PARIS='Europe/Paris';

// ── THEME ──────────────────────────────────────────────────────────────────
function applyTheme(t){currentTheme=t;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t);const ico=t==='dark'?'☀️':'🌙';document.querySelectorAll('#theme-btn').forEach(b=>b.textContent=ico);}
function toggleTheme(){applyTheme(currentTheme==='dark'?'light':'dark');}
applyTheme(currentTheme);

// ── UTILS ──────────────────────────────────────────────────────────────────
async function api(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);const data=await r.json();
  if(!r.ok)throw new Error(data.error||'Erreur réseau');return data;
}
function esc(str){if(!str)return '';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDate(dt){if(!dt)return '—';return new Date(dt).toLocaleString('fr-FR',{timeZone:PARIS,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function formatDateFr(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${parseInt(d)} ${['','janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][parseInt(m)]} ${y}`;}
function todayStr(){return new Date().toLocaleDateString('fr-CA',{timeZone:PARIS});}
function monthStr(d){return d.toLocaleDateString('fr-CA',{timeZone:PARIS}).substring(0,7);}
function roleLabel(r){return{super_admin:'Super Admin',hotel_admin:'Admin',chef_service:'Chef svc.',equipe:'Équipe'}[r]||r;}
function serviceLbl(s){return{general:'Général',reception:'Réception',housekeeping:'HK',fb:'F&B',maintenance:'Maint.',direction:'Direction'}[s]||(s||'—');}
function shiftLbl(s){return{matin:'☀️ Matin',apres_midi:'🌤 Après-midi',nuit:'🌙 Nuit'}[s]||s;}
function priorityLbl(p){return{low:'Faible',medium:'Moyenne',high:'Haute',urgent:'Urgent',critical:'Critique'}[p]||p;}
function fileIco(mt){return mt==='application/pdf'?'📄':'🖼';}
function fileSize(s){return s>1024*1024?`${(s/1024/1024).toFixed(1)} Mo`:`${(s/1024).toFixed(0)} Ko`;}
function filePicker(inputId,listId,multiple=true){return `<label class="file-picker-btn" for="${inputId}">📎 Cliquer pour choisir ${multiple?'des fichiers':'un fichier'}</label><input type="file" class="file-picker-input" id="${inputId}" accept=".jpg,.jpeg,.png,.pdf" ${multiple?'multiple':''} onchange="showFileList('${inputId}','${listId}')"><div class="files-list" id="${listId}"></div>`;}
function showFileList(inputId,listId){const files=Array.from(document.getElementById(inputId)?.files||[]);const list=document.getElementById(listId);if(!list)return;if(!files.length){list.innerHTML='';return;}list.innerHTML=files.map(f=>`<div class="file-row"><span class="ico">${fileIco(f.type)}</span><span class="name">${esc(f.name)}</span><span class="sz">${fileSize(f.size)}</span></div>`).join('');}
let _toast;
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className=`show ${type}`;clearTimeout(_toast);_toast=setTimeout(()=>el.className='',3500);}

// ── AUTH ──────────────────────────────────────────────────────────────────
async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  const err=document.getElementById('login-error');err.textContent='';
  try{currentUser=await api('/api/auth/login','POST',{username:u,password:p});startApp();}
  catch(e){err.textContent=e.message||'Erreur de connexion';}
}
async function doLogout(){await api('/api/auth/logout','POST').catch(()=>{});currentUser=null;if(socket)socket.disconnect();document.getElementById('app').classList.add('hidden');document.getElementById('login-screen').classList.remove('hidden');document.getElementById('login-pass').value='';}
async function checkAuth(){try{currentUser=await api('/api/auth/me');startApp();}catch{}}

function startApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sb-hotel').textContent=currentUser.hotel_name||'B Signature';
  document.getElementById('sb-user').textContent=currentUser.display_name;
  document.getElementById('sb-badge').innerHTML=`<span class="sb-badge">${roleLabel(currentUser.role)}</span>`;
  initSocket();updateDate();setInterval(updateDate,30000);navigate('dashboard');loadBadges();setInterval(loadBadges,30000);
}
function updateDate(){const d=new Date();const str=d.toLocaleDateString('fr-FR',{timeZone:PARIS,weekday:'short',day:'numeric',month:'short',year:'numeric'});document.getElementById('topbar-date').textContent=str.charAt(0).toUpperCase()+str.slice(1);}

// ── SOCKET ────────────────────────────────────────────────────────────────
function initSocket(){
  socket=io();
  socket.on('new_alert',a=>{
  if(['high','critical'].includes(a.priority)){
    document.getElementById('alert-notif-bar')?.remove();
    const bar=document.createElement('div');bar.id='alert-notif-bar';bar.className='alert-notif-bar';
    bar.innerHTML=`<span>🚨</span><span><strong>${esc(a.title)}</strong> — ${esc(a.message)}</span><button onclick="this.parentElement.remove()">✕</button>`;
    document.body.prepend(bar);
    if(a.priority!=='critical')setTimeout(()=>bar.remove(),30000);
  }
  toast(`⚠ ${a.title}`,a.priority==='critical'?'error':'');
  loadBadges();
  if(['dashboard','alerts'].includes(currentPage))navigate(currentPage);
});
  socket.on('alert_resolved',()=>{loadBadges();if(['dashboard','alerts'].includes(currentPage))navigate(currentPage);});
  socket.on('new_announcement',a=>{toast(`📢 ${a.title}`);if(currentPage==='announcements')navigate('announcements');});
  socket.on('chat_message',msg=>{if(currentPage==='chat'&&msg.service===currentChatService)appendChatMsg(msg);});
  socket.on('new_deduction',d=>{if(['hotel_admin','chef_service','super_admin'].includes(currentUser.role)){toast(`🧾 ${d.client_name} — ${parseFloat(d.amount).toFixed(2)} €`);loadBadges();}if(currentPage==='deductions')navigate('deductions');});
  socket.on('deduction_reviewed',()=>{loadBadges();if(currentPage==='deductions')navigate('deductions');});
  socket.on('new_maintenance',m=>{toast(`🔧 ${m.location}`);if(currentPage==='maintenance')navigate('maintenance');});
  socket.on('new_handover',()=>{if(currentPage==='handovers')loadCalendarMonth();});
  socket.on('handover_updated',()=>{if(currentPage==='handovers')loadCalendarMonth();});
  socket.on('handover_deleted',()=>{if(currentPage==='handovers')loadCalendarMonth();});
}
async function loadBadges(){
  try{const a=await api('/api/alerts?active=1');const ab=document.getElementById('badge-alerts');ab.textContent=a.length;ab.style.display=a.length?'':'none';}catch{}
  try{if(['hotel_admin','chef_service','super_admin'].includes(currentUser.role)){const d=await api('/api/deductions?status=pending');const db2=document.getElementById('badge-deductions');db2.textContent=d.length;db2.style.display=d.length?'':'none';}}catch{}
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function navigate(page){document.getElementById('sidebar')?.classList.remove('open');
document.getElementById('sidebar-overlay')?.classList.remove('visible');
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const found=[...document.querySelectorAll('.nav-item')].find(el=>el.getAttribute('onclick')===`navigate('${page}')`);
  if(found)found.classList.add('active');
  const titles={dashboard:'Dashboard',briefing:'Briefing quotidien',alerts:'Alertes urgentes',announcements:'Annonces',chat:'Chat',deductions:'Déductions',handovers:'Consignes & Passations',maintenance:'Maintenance',settings:'Paramètres'};
  document.getElementById('topbar-title').textContent=titles[page]||page;
  document.getElementById('topbar-actions').innerHTML='';
  const pages={dashboard,briefing,alerts,announcements,chat,deductions,handovers,maintenance,settings};
  if(pages[page])pages[page]();
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────
async function dashboard(){
  const c=document.getElementById('content');c.innerHTML='';
  try{
    const [activeAlerts,todayBriefing,dedSummary,anns,maint]=await Promise.all([api('/api/alerts?active=1'),api('/api/briefings'),api('/api/deductions/summary'),api('/api/announcements'),api('/api/maintenance?status=open')]);
    let html='<div class="fade-up">';
    activeAlerts.filter(a=>a.priority==='critical').forEach(a=>{html+=`<div class="critical-banner"><div class="critical-dot"></div><div class="critical-text"><div class="critical-title">⚠ CRITIQUE — ${esc(a.title)}</div><div class="critical-msg">${esc(a.message)}</div></div><button class="btn btn-sm btn-outline" onclick="resolveAlert(${a.id})">Résoudre</button></div>`;});
    html+=`<div class="grid-4" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-val" style="color:${activeAlerts.length>0?'var(--red)':'var(--green)'}">${activeAlerts.length}</div><div class="stat-label">Alertes actives</div></div>
      <div class="stat-card"><div class="stat-val" style="color:${(dedSummary.pending||0)>0?'var(--orange)':'var(--text3)'}">${dedSummary.pending||0}</div><div class="stat-label">Déductions en attente</div></div>
      <div class="stat-card"><div class="stat-val">${maint.length}</div><div class="stat-label">Maintenance ouverte</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--gold)">${(dedSummary.total_approved_amount||0).toFixed(0)} €</div><div class="stat-label">Déductions approuvées</div></div>
    </div><div class="grid-2">`;
    html+=`<div class="card"><div class="card-header"><div class="card-title">📋 Briefing du jour</div><button class="btn btn-outline btn-sm" onclick="navigate('briefing')">Voir →</button></div>`;
    if(todayBriefing){const prev=todayBriefing.content.length>200?todayBriefing.content.substring(0,200)+'…':todayBriefing.content;html+=`<div class="briefing-content">${esc(prev)}</div><div class="briefing-date" style="margin-top:10px">Par ${esc(todayBriefing.author_name||'—')}</div>`;}
    else html+=`<div class="empty-state" style="padding:20px"><div class="empty-ico">📋</div><div class="empty-txt">Aucun briefing aujourd'hui</div></div>`;
    html+=`</div><div class="card"><div class="card-header"><div class="card-title">📢 Annonces</div><button class="btn btn-outline btn-sm" onclick="navigate('announcements')">Voir →</button></div>`;
    if(!anns.length)html+=`<div class="empty-state" style="padding:20px"><div class="empty-ico">📢</div><div class="empty-txt">Aucune annonce</div></div>`;
    else html+=anns.slice(0,3).map(a=>`<div class="list-item" style="cursor:default"><div class="list-item-body"><div class="list-item-title">${a.pinned?'📌 ':''}${esc(a.title)}</div><div class="list-item-sub">${esc(a.content.substring(0,80))}${a.content.length>80?'…':''}</div></div></div>`).join('');
    html+=`</div></div></div>`;c.innerHTML=html;
  }catch(e){c.innerHTML=`<div class="empty-state"><div class="empty-ico">⚠</div><div>Erreur</div></div>`;console.error(e);}
}

// ── BRIEFING ──────────────────────────────────────────────────────────────
async function briefing(){
  const c=document.getElementById('content');const canEdit=['hotel_admin','super_admin','chef_service'].includes(currentUser.role);
  try{
    const [current,recent]=await Promise.all([api('/api/briefings'),api('/api/briefings/recent')]);
    let html='<div class="grid-2 fade-up">';
    html+=`<div class="card"><div class="card-header"><div class="card-title">📋 Aujourd'hui</div>${canEdit?'<button class="btn btn-gold btn-sm" onclick="saveBriefing()">💾 Enregistrer</button>':''}</div>`;
    if(canEdit)html+=`<textarea id="briefing-editor" placeholder="Briefing du jour…">${current?esc(current.content):''}</textarea>`;
    else html+=current?`<div class="briefing-date">Par ${esc(current.author_name||'—')}</div><div class="briefing-content">${esc(current.content)}</div>`:`<div class="empty-state" style="padding:20px"><div class="empty-ico">📋</div><div>Aucun briefing</div></div>`;
    html+=`</div><div class="card"><div class="card-header"><div class="card-title">Historique</div></div>`;
    if(!recent.length)html+=`<div class="empty-state" style="padding:20px"><div>Aucun historique</div></div>`;
    else html+=recent.map(b=>`<div class="list-item" style="cursor:pointer" onclick="showBriefingDetail('${esc(b.date)}',\`${esc(b.content).replace(/`/g,'\\`')}\`,'${esc(b.author_name||'')}')"><div class="list-item-body"><div class="list-item-title">${formatDateFr(b.date)}</div><div class="list-item-sub">${esc(b.content.substring(0,80))}${b.content.length>80?'…':''}</div><div class="list-item-meta"><span>Par ${esc(b.author_name||'—')}</span></div></div></div>`).join('');
    html+=`</div></div>`;c.innerHTML=html;
  }catch{c.innerHTML='<div class="empty-state">Erreur</div>';}
}
async function saveBriefing(){const content=document.getElementById('briefing-editor')?.value.trim();if(!content){toast('Contenu vide','error');return;}try{await api('/api/briefings','POST',{content});toast('Briefing enregistré ✓','success');}catch(e){toast(e.message,'error');}}
function showBriefingDetail(date,content,author){openModal(`Briefing — ${formatDateFr(date)}`,`<div class="briefing-date">Par ${esc(author||'—')}</div><div class="briefing-content" style="margin-top:12px">${esc(content)}</div>`,[]);}

// ── ALERTS ────────────────────────────────────────────────────────────────
async function alerts(){
  const c=document.getElementById('content');const canCreate=['hotel_admin','super_admin','chef_service'].includes(currentUser.role);
  document.getElementById('topbar-actions').innerHTML=canCreate?`<button class="btn btn-gold btn-sm" onclick="openAlertModal()">+ Alerte</button>`:'';
  try{
    const list=await api('/api/alerts');let html='<div class="fade-up">';
    if(!list.length)html+=`<div class="empty-state"><div class="empty-ico">✅</div><div class="empty-txt">Aucune alerte</div></div>`;
    else{const active=list.filter(a=>!a.resolved_at);const resolved=list.filter(a=>a.resolved_at);
      if(active.length){html+=`<div class="card"><div class="card-title" style="margin-bottom:14px">Actives</div>`;html+=active.map(a=>alertItem(a,canCreate)).join('');html+=`</div>`;}
      if(resolved.length){html+=`<div class="card"><div class="card-title" style="margin-bottom:14px">Résolues</div>`;html+=resolved.slice(0,8).map(a=>alertItem(a,false)).join('');html+=`</div>`;}
    }
    html+='</div>';c.innerHTML=html;
  }catch{c.innerHTML='<div class="empty-state">Erreur</div>';}
}

async function loadCalendarMonth(){

  try{
    const list=await api(`/api/handovers?month=${month}`);
    // Group by date
    calendarData={};
    list.forEach(h=>{if(!calendarData[h.date])calendarData[h.date]=[];calendarData[h.date].push(h);});
    renderCalendar();
    // Refresh selected day panel
    if(calendarSelected)renderDayPanel(calendarSelected);
  }catch(e){console.error(e);}
}

function renderCalendar(){
  const d=new Date(calendarDate);
  const year=d.getFullYear();
  const month=d.getMonth();
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('cal-month-title').textContent=`${months[month]} ${year}`;

  const grid=document.getElementById('cal-grid');
  const days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let html=days.map(d=>`<div class="cal-day-header">${d}</div>`).join('');

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const today=todayStr();

  // Start from Monday
  let startDow=first.getDay()-1;if(startDow<0)startDow=6;

  // Previous month padding
  for(let i=0;i<startDow;i++){
    const pd=new Date(year,month,1-startDow+i);
    const ds=pd.toLocaleDateString('fr-CA',{timeZone:PARIS});
    const count=(calendarData[ds]||[]).length;
    html+=`<div class="cal-day other-month" onclick="selectCalDay('${ds}')">
      <div class="cal-day-num">${pd.getDate()}</div>
      ${count>0?`<div class="cal-dots">${renderDots(calendarData[ds])}</div>`:''}</div>`;
  }

  for(let day=1;day<=last.getDate();day++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=ds===today;
    const isSelected=ds===calendarSelected;
    const hos=calendarData[ds]||[];
    html+=`<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectCalDay('${ds}')">
      <div class="cal-day-num">${day}</div>
      ${hos.length>0?`<div class="cal-dots">${renderDots(hos)}</div><div class="cal-day-count">${hos.length} consigne${hos.length>1?'s':''}</div>`:''}
    </div>`;
  }

  // Next month padding to complete the grid
  const totalCells=startDow+last.getDate();const remainder=(7-totalCells%7)%7;
  for(let i=1;i<=remainder;i++){
    const nd=new Date(year,month+1,i);const ds=nd.toLocaleDateString('fr-CA',{timeZone:PARIS});
    html+=`<div class="cal-day other-month" onclick="selectCalDay('${ds}')"><div class="cal-day-num">${i}</div></div>`;
  }

  grid.innerHTML=html;
}

function renderDots(hos){
  const seen=new Set();const dots=[];
  hos.forEach(h=>{const key=`${h.shift}_${h.service||'general'}`;if(!seen.has(key)){seen.add(key);dots.push(h);}});
  const colors={reception:'#4a80c8',housekeeping:'#4a9460',fb:'#c87830',maintenance:'#d94f4f',direction:'#c9a84c',general:'#6b5c3e'};
  return dots.slice(0,6).map(h=>`<div class="cal-dot" style="background:${colors[h.service||'general']||'#6b5c3e'}" title="${serviceLbl(h.service)} · ${shiftLbl(h.shift)}"></div>`).join('');
}

function calNav(dir){
  calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+dir,1);
  loadCalendarMonth();
}

function calGoToday(){
  calendarDate=new Date();
  calendarSelected=todayStr();
  loadCalendarMonth();
}

function selectCalDay(dateStr){
  calendarSelected=dateStr;
  renderCalendar(); // re-render to update selected state
  renderDayPanel(dateStr);
}

function renderDayPanel(dateStr){
  const hos=calendarData[dateStr]||[];
  const isOwn=(h)=>h.created_by===currentUser.id;
  const isManager=['hotel_admin','chef_service','super_admin'].includes(currentUser.role);
  const canEdit=(h)=>isOwn(h)||isManager;

  document.getElementById('cal-panel-title').textContent=formatDateFr(dateStr);

  const shifts=[{id:'matin',lbl:'☀️ Matin'},{id:'apres_midi',lbl:'🌤 Après-midi'},{id:'nuit',lbl:'🌙 Nuit'}];
  let html='';
  if(!hos.length){html='<div class="empty-state" style="padding:20px"><div class="empty-ico">📋</div><div>Aucune consigne ce jour</div></div>';}
  else{
    shifts.forEach(shift=>{
      const items=hos.filter(h=>h.shift===shift.id);
      if(!items.length)return;
      html+=`<div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:10px 0 6px">${shift.lbl}</div>`;
      items.forEach(h=>{
        html+=`<div class="ho-item shift-${h.shift}">
          <div class="ho-content">${esc(h.content)}</div>
          <div class="ho-meta">
            <span>${esc(h.author_name||'—')}</span>
            <span>${serviceLbl(h.service)}</span>
            ${canEdit(h)?`<span class="ho-actions">
              <button class="btn btn-ghost btn-xs" onclick="editHandover(${h.id},'${esc(h.content).replace(/'/g,"\\'")}','${h.shift}','${h.service}')">✏️</button>
              <button class="btn btn-ghost btn-xs" onclick="deleteHandover(${h.id},'${dateStr}')">🗑</button>
            </span>`:''}
          </div>
        </div>`;
      });
    });
  }

  document.getElementById('cal-panel-body').innerHTML=html;
  document.getElementById('cal-panel-footer').innerHTML=`<button class="btn btn-gold" style="width:100%" onclick="openAddHandoverModal('${dateStr}')">+ Ajouter une consigne</button>`;
}

function openAddHandoverModal(dateStr){
  const defaultService=currentUser.service||'general';
  openModal(`Consigne — ${formatDateFr(dateStr)}`,
    `<div class="fields-row c2">
       <div class="field"><label>Shift</label><select id="m-hos"><option value="matin">☀️ Matin</option><option value="apres_midi">🌤 Après-midi</option><option value="nuit">🌙 Nuit</option></select></div>
       <div class="field"><label>Service</label><select id="m-hosv">
         <option value="reception" ${defaultService==='reception'?'selected':''}>Réception</option>
         <option value="housekeeping" ${defaultService==='housekeeping'?'selected':''}>Housekeeping</option>
         <option value="fb" ${defaultService==='fb'?'selected':''}>F&B</option>
         <option value="maintenance" ${defaultService==='maintenance'?'selected':''}>Maintenance</option>
         <option value="general">Général</option>
       </select></div>
     </div>
     <div class="field"><label>Consigne</label><textarea id="m-hoc" style="min-height:120px" placeholder="Informations à transmettre…"></textarea></div>`,
    [{label:'Annuler',cls:'btn-outline',action:closeModal},{label:'Enregistrer',cls:'btn-gold',action:async()=>{
      const content=document.getElementById('m-hoc').value.trim();
      if(!content){toast('Contenu requis','error');return;}
      try{
        await api('/api/handovers','POST',{content,shift:document.getElementById('m-hos').value,service:document.getElementById('m-hosv').value,date:dateStr});
        closeModal();toast('Consigne enregistrée ✓','success');await loadCalendarMonth();
      }catch(e){toast(e.message,'error');}
    }}]
  );
}

function editHandover(id,content,shift,service){
  openModal('Modifier la consigne',
    `<div class="fields-row c2">
       <div class="field"><label>Shift</label><select id="m-ehs">${['matin','apres_midi','nuit'].map(s=>`<option value="${s}" ${s===shift?'selected':''}>${shiftLbl(s)}</option>`).join('')}</select></div>
       <div class="field"><label>Service</label><select id="m-ehsv">${['reception','housekeeping','fb','maintenance','general'].map(s=>`<option value="${s}" ${s===service?'selected':''}>${serviceLbl(s)}</option>`).join('')}</select></div>
     </div>
     <div class="field"><label>Consigne</label><textarea id="m-ehc" style="min-height:120px">${esc(content)}</textarea></div>`,
    [{label:'Annuler',cls:'btn-outline',action:closeModal},{label:'Enregistrer',cls:'btn-gold',action:async()=>{
      const c=document.getElementById('m-ehc').value.trim();
      if(!c){toast('Contenu requis','error');return;}
      try{await api(`/api/handovers/${id}`,'PATCH',{content:c,shift:document.getElementById('m-ehs').value,service:document.getElementById('m-ehsv').value});closeModal();toast('Modifié ✓','success');await loadCalendarMonth();}
      catch(e){toast(e.message,'error');}
    }}]
  );
}

async function deleteHandover(id,dateStr){
  if(!confirm('Supprimer cette consigne ?'))return;
  try{await api(`/api/handovers/${id}`,'DELETE');toast('Supprimée','success');await loadCalendarMonth();}
  catch(e){toast(e.message,'error');}
}

// ── MAINTENANCE ────────────────────────────────────────────────────────────
async function maintenance(){
  const c=document.getElementById('content');const canUpdate=['hotel_admin','chef_service','super_admin'].includes(currentUser.role);
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-gold btn-sm" onclick="openMaintModal()">+ Bon de travaux</button>`;
  try{
    const list=await api('/api/maintenance');let html='<div class="fade-up">';
    const open=list.filter(m=>m.status!=='done');const done=list.filter(m=>m.status==='done');
    if(!open.length)html+=`<div class="empty-state"><div class="empty-ico">✅</div><div class="empty-txt">Aucun ticket ouvert</div></div>`;
    else{html+=`<div class="card"><div class="card-header"><div class="card-title">En cours</div></div>`;html+=open.map(m=>maintItem(m,canUpdate)).join('');html+=`</div>`;}
    if(done.length){html+=`<div class="card"><div class="card-header"><div class="card-title">Résolus</div></div>`;html+=done.slice(0,5).map(m=>maintItem(m,false)).join('');html+=`</div>`;}
    html+='</div>';c.innerHTML=html;
  }catch{c.innerHTML='<div class="empty-state">Erreur</div>';}
}
function maintItem(m,canUpdate){return `<div class="list-item"><div class="list-item-body"><div class="list-item-title">${esc(m.location)}<span class="badge badge-${m.priority}">${priorityLbl(m.priority)}</span><span class="badge badge-${m.status}">${{open:'Ouvert',in_progress:'En cours',done:'Résolu'}[m.status]}</span></div><div class="list-item-sub">${esc(m.description)}</div><div class="list-item-meta"><span>Par ${esc(m.creator_name||'—')}</span><span>${formatDate(m.created_at)}</span></div></div>${canUpdate&&m.status!=='done'?`<div class="list-item-actions">${m.status==='open'?`<button class="btn btn-outline btn-sm" onclick="updateMaint(${m.id},'in_progress')">En cours</button>`:''}<button class="btn btn-green btn-sm" onclick="updateMaint(${m.id},'done')">✓ Résolu</button></div>`:''}</div>`;}
function openMaintModal(){openModal('Nouveau bon de travaux',`<div class="field"><label>Lieu</label><input id="m-ml" placeholder="Ch. 302, Cuisine, Lobby…"></div><div class="field"><label>Description</label><textarea id="m-md"></textarea></div><div class="field"><label>Priorité</label><select id="m-mp"><option value="low">Faible</option><option value="medium" selected>Moyenne</option><option value="high">Haute</option><option value="urgent">🔴 Urgent</option></select></div>`,[{label:'Créer',cls:'btn-gold',action:async()=>{const location=document.getElementById('m-ml').value.trim();const description=document.getElementById('m-md').value.trim();if(!location||!description){toast('Lieu et description requis','error');return;}await api('/api/maintenance','POST',{location,description,priority:document.getElementById('m-mp').value});closeModal();toast('Bon créé ✓','success');navigate('maintenance');}}]);}
async function updateMaint(id,status){try{await api(`/api/maintenance/${id}`,'PATCH',{status});toast(status==='done'?'Résolu ✓':'Mis à jour','success');}catch(e){toast(e.message,'error');}}

// ── SETTINGS ──────────────────────────────────────────────────────────────
async function settings(){
  const c=document.getElementById('content');
  const isSuperAdmin=currentUser.role==='super_admin';
  const isAdmin=['hotel_admin','super_admin'].includes(currentUser.role);

  let tabsHtml=`<div class="settings-tabs">
    <button class="settings-tab active" onclick="switchSettingsTab('profil',this)">👤 Mon profil</button>`;
  if(isSuperAdmin) tabsHtml+=`<button class="settings-tab" onclick="switchSettingsTab('users',this)">👥 Utilisateurs</button>`;
  tabsHtml+=`</div>`;

  c.innerHTML=`<div class="fade-up">${tabsHtml}
    <div id="settings-profil" class="settings-section active"></div>
    ${isSuperAdmin?'<div id="settings-users" class="settings-section"></div>':''}
  </div>`;

  loadSettingsProfil();
  if(isSuperAdmin) loadSettingsUsers();
}

function switchSettingsTab(id,btn){
  document.querySelectorAll('.settings-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.settings-section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  const el=document.getElementById(`settings-${id}`);
  if(el)el.classList.add('active');
}

function loadSettingsProfil(){
  const el=document.getElementById('settings-profil');
  if(!el)return;
  el.innerHTML=`
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><div class="card-title">Informations</div></div>
        <div class="info-box">
          <strong>Nom :</strong> ${esc(currentUser.display_name)}<br>
          <strong>Identifiant :</strong> @${esc(currentUser.username)}<br>
          <strong>Rôle :</strong> ${roleLabel(currentUser.role)}<br>
          <strong>Service :</strong> ${serviceLbl(currentUser.service)}<br>
          <strong>Hôtel :</strong> ${esc(currentUser.hotel_name||'—')}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Changer le mot de passe</div></div>
        <div class="field"><label>Mot de passe actuel</label><input type="password" id="pw-current" placeholder="••••••••"></div>
        <div class="field"><label>Nouveau mot de passe</label><input type="password" id="pw-new" placeholder="Min. 8 caractères"></div>
        <div class="field"><label>Confirmation</label><input type="password" id="pw-confirm" placeholder="••••••••"></div>
        <button class="btn btn-gold" onclick="changePassword()">Mettre à jour</button>
      </div>
    </div>`;
}

async function changePassword(){
  const cur=document.getElementById('pw-current').value;
  const nw=document.getElementById('pw-new').value;
  const conf=document.getElementById('pw-confirm').value;
  if(!cur||!nw){toast('Tous les champs sont requis','error');return;}
  if(nw!==conf){toast('Les mots de passe ne correspondent pas','error');return;}
  if(nw.length<8){toast('Minimum 8 caractères','error');return;}
  try{
    await api('/api/auth/change-password','POST',{current_password:cur,new_password:nw});
    toast('Mot de passe mis à jour ✓','success');
    document.getElementById('pw-current').value='';
    document.getElementById('pw-new').value='';
    document.getElementById('pw-confirm').value='';
  }catch(e){toast(e.message,'error');}
}

async function loadSettingsUsers(){
  const el=document.getElementById('settings-users');if(!el)return;
  el.innerHTML='<div class="text-muted" style="padding:16px">Chargement…</div>';
  try{
    const [list,hotels]=await Promise.all([api('/api/admin/users'),api('/api/admin/hotels')]);
    const groups={};list.forEach(u=>{const key=u.hotel_name||'Super Admin';if(!groups[key])groups[key]=[];groups[key].push(u);});
    let html=`<div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn btn-gold" onclick="openCreateUserModal()">+ Nouveau compte</button></div>`;
    Object.entries(groups).forEach(([hotel,members])=>{
      html+=`<div class="card"><div class="card-header"><div class="card-title">🏨 ${esc(hotel)}</div><span class="pill">${members.length} compte${members.length>1?'s':''}</span></div>`;
      html+=members.map(u=>`<div class="user-card ${u.active?'':'user-inactive'}">
        <div class="user-avatar">${esc(u.display_name[0]||'?')}</div>
        <div class="user-info">
          <div class="user-name">${esc(u.display_name)}</div>
          <div class="user-meta">
            <span class="badge badge-${u.role}">${roleLabel(u.role)}</span>
            ${u.service?`<span class="pill">${serviceLbl(u.service)}</span>`:''}
            <span style="font-size:10px">@${esc(u.username)}</span>
            ${!u.active?'<span style="color:var(--red);font-size:11px">Inactif</span>':''}
            ${u.last_login?`<span>Dernière co : ${formatDate(u.last_login)}</span>`:''}
          </div>
        </div>
        <div class="list-item-actions">
          <button class="btn btn-outline btn-sm" onclick='openEditUserModal(${JSON.stringify(u)})'>Modifier</button>
          ${u.active?`<button class="btn btn-danger btn-xs" onclick="disableUser(${u.id})">Désactiver</button>`:`<button class="btn btn-green btn-xs" onclick="enableUser(${u.id})">Réactiver</button>`}
        </div>
      </div>`).join('');
      html+=`</div>`;
    });
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="empty-state">Erreur</div>';console.error(e);}
}

async function openCreateUserModal(){
  const hotels=await api('/api/admin/hotels');const hotelOpts=hotels.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');
  openModal('Nouveau compte utilisateur',
    `<div class="info-box">Seul un Super Admin peut créer des comptes. Le mot de passe doit faire minimum 8 caractères.</div>
     <div class="fields-row c2"><div class="field"><label>Identifiant *</label><input id="m-uu" placeholder="prenom.nom"></div><div class="field"><label>Nom affiché *</label><input id="m-un" placeholder="Prénom NOM"></div></div>
     <div class="field"><label>Mot de passe *</label><input type="password" id="m-upw"></div>
     <div class="fields-row c2"><div class="field"><label>Rôle *</label><select id="m-ur" onchange="toggleHotelField()">
       <option value="equipe">Équipe</option>
       <option value="chef_service">Chef de service</option>
       <option value="hotel_admin">Admin Hôtel</option>
       <option value="super_admin">Super Admin</option>
     </select></div>
     <div class="field"><label>Service</label><select id="m-usv"><option value="">—</option><option value="reception">Réception</option><option value="housekeeping">Housekeeping</option><option value="fb">F&B</option><option value="maintenance">Maintenance</option><option value="direction">Direction</option></select></div></div>
     <div class="field" id="hotel-field"><label>Hôtel *</label><select id="m-uh">${hotelOpts}</select></div>`,
    [{label:'Annuler',cls:'btn-outline',action:closeModal},{label:'Créer le compte',cls:'btn-gold',action:async()=>{
      try{await api('/api/admin/users','POST',{username:document.getElementById('m-uu').value.trim(),password:document.getElementById('m-upw').value,display_name:document.getElementById('m-un').value.trim(),role:document.getElementById('m-ur').value,service:document.getElementById('m-usv').value,hotel_id:document.getElementById('m-uh')?.value});closeModal();toast('Compte créé ✓','success');loadSettingsUsers();}
      catch(e){toast(e.message,'error');}
    }}]
  );
}
function toggleHotelField(){const role=document.getElementById('m-ur')?.value;const hf=document.getElementById('hotel-field');if(hf)hf.style.display=role==='super_admin'?'none':'';}

async function openEditUserModal(u){
  const hotels=await api('/api/admin/hotels');const hotelOpts=hotels.map(h=>`<option value="${h.id}" ${h.id==u.hotel_id?'selected':''}>${esc(h.name)}</option>`).join('');
  openModal(`Modifier — ${esc(u.display_name)}`,
    `<div class="fields-row c2"><div class="field"><label>Nom affiché</label><input id="m-en" value="${esc(u.display_name)}"></div><div class="field"><label>Nouveau mot de passe</label><input type="password" id="m-epw" placeholder="Laisser vide = inchangé"></div></div>
     <div class="fields-row c2"><div class="field"><label>Rôle</label><select id="m-er">${['equipe','chef_service','hotel_admin','super_admin'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></div><div class="field"><label>Service</label><select id="m-esv"><option value="">—</option>${['reception','housekeeping','fb','maintenance','direction'].map(s=>`<option value="${s}" ${s===u.service?'selected':''}>${serviceLbl(s)}</option>`).join('')}</select></div></div>
     <div class="field"><label>Hôtel</label><select id="m-eh">${hotelOpts}</select></div>`,
    [{label:'Annuler',cls:'btn-outline',action:closeModal},{label:'Enregistrer',cls:'btn-gold',action:async()=>{
      const body={display_name:document.getElementById('m-en').value,role:document.getElementById('m-er').value,service:document.getElementById('m-esv').value,hotel_id:document.getElementById('m-eh').value};const pw=document.getElementById('m-epw').value;if(pw)body.password=pw;
      try{await api(`/api/admin/users/${u.id}`,'PATCH',body);closeModal();toast('Modifié ✓','success');loadSettingsUsers();}catch(e){toast(e.message,'error');}
    }}]
  );
}
async function disableUser(id){if(!confirm('Désactiver ce compte ?'))return;await api(`/api/admin/users/${id}`,'PATCH',{active:false});toast('Désactivé','success');loadSettingsUsers();}
async function enableUser(id){await api(`/api/admin/users/${id}`,'PATCH',{active:true});toast('Réactivé ✓','success');loadSettingsUsers();}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(title,body,buttons){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  const footer=document.getElementById('modal-footer');footer.innerHTML='';
  buttons.forEach(b=>{const btn=document.createElement('button');btn.className=`btn ${b.cls}`;btn.textContent=b.label;btn.onclick=b.action;footer.appendChild(btn);});
  document.getElementById('modal-overlay').classList.add('visible');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('visible');}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

// ── INIT ──────────────────────────────────────────────────────────────────
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('visible');
}
checkAuth();
</script>
