<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0e0c09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Vernet Ops</title>
<link rel="manifest" href="/manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c09;--bg2:#161310;--bg3:#1e1a13;--bg4:#28231a;
  --gold:#c9a84c;--gold2:#e8c87a;--gold3:#8a6e30;--gold4:#3a2f18;
  --text:#e8e0cc;--text2:#b09a72;--text3:#6e5e3e;
  --red:#c94040;--red-bg:#2a1010;
  --green:#4a9460;--green-bg:#0e2018;
  --blue:#3a6ea8;--blue-bg:#0e1a2a;
  --orange:#c87830;--orange-bg:#2a1a08;
  --border:#2a2418;--border2:#3a3020;
  --r:8px;--r2:12px;
  --sidebar-w:220px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;overflow:hidden}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#login-screen.hidden{display:none}
.login-box{width:320px;padding:40px 32px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .name{font-size:22px;font-weight:600;color:var(--gold);letter-spacing:2px}
.login-logo .sub{font-size:11px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.login-box input{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;margin-bottom:12px;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--gold3)}
.login-box button{width:100%;padding:11px;background:var(--gold);color:#0e0c09;font-weight:700;font-size:14px;letter-spacing:1px;border:none;border-radius:var(--r);cursor:pointer;transition:.2s}
.login-box button:hover{background:var(--gold2)}
.login-error{color:var(--red);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* ── APP LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}
#app.hidden{display:none}

/* Sidebar */
#sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-hotel{font-size:13px;font-weight:600;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user{font-size:11px;color:var(--text3);margin-top:3px}
.sidebar-nav{flex:1;padding:8px 0}
.nav-section{padding:14px 16px 4px;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text2);transition:.15s;border-left:2px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--gold);border-left-color:var(--gold)}
.nav-item .icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-item .label{font-size:13px}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.logout-btn{width:100%;padding:7px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);color:var(--text3);cursor:pointer;font-size:12px;transition:.2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}

/* Main area */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar-title{font-size:16px;font-weight:600;color:var(--text)}
#topbar-date{margin-left:auto;font-size:12px;color:var(--text3)}
.alert-banner{background:var(--red-bg);border-bottom:1px solid var(--red);padding:8px 20px;font-size:13px;color:#ff9090;display:none}
.alert-banner.visible{display:block}

#content{flex:1;overflow-y:auto;padding:20px}

/* ── CARDS & COMPONENTS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title span{flex:1}
h2.page-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* Stat box */
.stat{text-align:center;padding:16px 12px}
.stat-val{font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.stat-label{font-size:11px;color:var(--text3);margin-top:6px;letter-spacing:1px;text-transform:uppercase}

/* Buttons */
.btn{padding:8px 16px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:var(--gold);color:#0e0c09}.btn-gold:hover{background:var(--gold2)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--gold3);color:var(--text)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}.btn-green:hover{background:var(--green);color:#fff}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:.2s;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold3)}
.field textarea{resize:vertical;min-height:80px}
.field select option{background:var(--bg3)}
.fields-row{display:grid;gap:12px}
.fields-row.c2{grid-template-columns:1fr 1fr}
.fields-row.c3{grid-template-columns:1fr 1fr 1fr}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-pending{background:var(--orange-bg);color:var(--orange)}
.badge-approved{background:var(--green-bg);color:var(--green)}
.badge-rejected{background:var(--red-bg);color:var(--red)}
.badge-critical{background:var(--red);color:#fff}
.badge-high{background:var(--red-bg);color:var(--red)}
.badge-medium{background:var(--orange-bg);color:var(--orange)}
.badge-low{background:var(--bg4);color:var(--text3)}
.badge-open{background:var(--blue-bg);color:var(--blue)}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge-in_progress{background:var(--orange-bg);color:var(--orange)}

/* List items */
.list-item{padding:12px 14px;background:var(--bg3);border-radius:var(--r);margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;transition:.15s}
.list-item:hover{background:var(--bg4)}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-sub{font-size:12px;color:var(--text3);margin-top:3px}
.list-item-meta{font-size:11px;color:var(--text3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.list-item-actions{display:flex;gap:6px;flex-shrink:0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.visible{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:24px;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:15px;font-weight:700;color:var(--gold)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* Chat */
#chat-container{display:flex;flex-direction:column;height:calc(100vh - 140px)}
.chat-channels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.channel-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:.15s}
.channel-btn:hover{border-color:var(--gold3);color:var(--text)}
.channel-btn.active{background:var(--gold);color:#0e0c09;border-color:var(--gold);font-weight:600}
#chat-messages{flex:1;overflow-y:auto;background:var(--bg3);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.chat-msg{display:flex;flex-direction:column;max-width:80%}
.chat-msg.own{align-self:flex-end;align-items:flex-end}
.chat-msg-bubble{padding:8px 12px;border-radius:12px;background:var(--bg4);font-size:13px;line-height:1.5}
.chat-msg.own .chat-msg-bubble{background:var(--gold4);border:1px solid var(--gold3)}
.chat-msg-meta{font-size:10px;color:var(--text3);margin-top:2px}
.chat-input-row{display:flex;gap:8px;margin-top:12px}
.chat-input-row input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none}
.chat-input-row input:focus{border-color:var(--gold3)}

/* Dashboard specific */
.critical-alert{background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.critical-alert-title{font-size:13px;font-weight:700;color:var(--red)}
.critical-alert-msg{font-size:12px;color:#ff9090;margin-top:4px}

/* Briefing editor */
#briefing-editor{width:100%;min-height:200px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;line-height:1.7;padding:14px;resize:vertical;outline:none;font-family:inherit}
#briefing-editor:focus{border-color:var(--gold3)}
.briefing-content{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;padding:4px 0}
.briefing-date{font-size:12px;color:var(--text3);margin-bottom:4px}

/* Deduction table */
.ded-table{width:100%;border-collapse:collapse;font-size:12px}
.ded-table th{padding:8px 10px;background:var(--bg3);color:var(--text3);font-weight:600;text-align:left;border-bottom:1px solid var(--border)}
.ded-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.ded-table tr:last-child td{border-bottom:none}
.ded-table tr:hover td{background:var(--bg3)}
.amount{font-weight:700;color:var(--gold);font-family:monospace}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 18px;font-size:13px;color:var(--text);z-index:999;transform:translateY(80px);opacity:0;transition:.3s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:var(--green);color:var(--green)}
#toast.error{border-color:var(--red);color:var(--red)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .icon{font-size:32px;margin-bottom:12px}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-gold{color:var(--gold)}
.text-muted{color:var(--text3)}

@media(max-width:640px){
  #sidebar{display:none}
  #sidebar.open{display:flex;position:fixed;inset:0 auto 0 0;z-index:150;width:240px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .fields-row.c2,.fields-row.c3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="name">VERNET OPS</div>
      <div class="sub">B Signature Hôtels &amp; Resorts</div>
    </div>
    <input type="text" id="login-user" placeholder="Identifiant" autocomplete="username">
    <input type="password" id="login-pass" placeholder="Mot de passe" autocomplete="current-password">
    <button onclick="doLogin()">Connexion</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-hotel" id="sb-hotel">Chargement...</div>
      <div class="sidebar-user" id="sb-user"></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Opérations</div>
      <div class="nav-item active" onclick="navigate('dashboard')"><span class="icon">⬛</span><span class="label">Dashboard</span></div>
      <div class="nav-item" onclick="navigate('briefing')"><span class="icon">📋</span><span class="label">Briefing</span></div>
      <div class="nav-item" onclick="navigate('alerts')"><span class="icon">🔴</span><span class="label">Alertes</span><span class="nav-badge" id="badge-alerts" style="display:none">0</span></div>
      <div class="nav-item" onclick="navigate('announcements')"><span class="icon">📢</span><span class="label">Annonces</span></div>
      <div class="nav-item" onclick="navigate('chat')"><span class="icon">💬</span><span class="label">Chat</span></div>
      <div class="nav-section">Contrôle</div>
      <div class="nav-item" onclick="navigate('deductions')"><span class="icon">🧾</span><span class="label">Déductions</span><span class="nav-badge" id="badge-deductions" style="display:none">0</span></div>
      <div class="nav-item" onclick="navigate('handovers')"><span class="icon">🔄</span><span class="label">Passations</span></div>
      <div class="nav-item" onclick="navigate('maintenance')"><span class="icon">🔧</span><span class="label">Maintenance</span></div>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <div id="topbar-title">Dashboard</div>
      <div id="topbar-date"></div>
    </div>
    <div id="alert-banner" class="alert-banner"></div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Titre</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let currentUser = null;
let socket = null;
let currentPage = 'dashboard';
let currentChatService = 'general';

// ── AUTH ──────────────────────────────────────────────────────────────────

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await api('/api/auth/login', 'POST', { username: u, password: p });
    currentUser = r;
    startApp();
  } catch(e) {
    err.textContent = e.message || 'Erreur de connexion';
  }
}

async function doLogout() {
  await api('/api/auth/logout', 'POST');
  currentUser = null;
  if (socket) socket.disconnect();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-pass').value = '';
}

async function checkAuth() {
  try {
    currentUser = await api('/api/auth/me');
    startApp();
  } catch { /* not logged in */ }
}

// ── APP START ─────────────────────────────────────────────────────────────

function startApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('sb-hotel').textContent = currentUser.hotel_name || 'Super Admin';
  document.getElementById('sb-user').textContent = `${currentUser.display_name} · ${roleLabel(currentUser.role)}`;

  // Admin-only nav items
  if (['hotel_admin','super_admin','chef_service'].includes(currentUser.role)) {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  }

  initSocket();
  updateDate();
  setInterval(updateDate, 60000);
  navigate('dashboard');
  loadBadges();
}

function updateDate() {
  const d = new Date();
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  document.getElementById('topbar-date').textContent =
    `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function roleLabel(r) {
  return {super_admin:'Super Admin',hotel_admin:'Admin Hôtel',chef_service:'Chef de service',equipe:'Équipe'}[r] || r;
}

function serviceLabel(s) {
  return {general:'Général',reception:'Réception',housekeeping:'Housekeeping',fb:'F&B',maintenance:'Maintenance',direction:'Direction'}[s] || s;
}

// ── SOCKET ────────────────────────────────────────────────────────────────

function initSocket() {
  socket = io();

  socket.on('new_alert', (alert) => {
    toast(`⚠️ Alerte : ${alert.title}`, alert.priority === 'critical' ? 'error' : '');
    loadBadges();
    if (currentPage === 'alerts') navigate('alerts');
    if (currentPage === 'dashboard') navigate('dashboard');
  });

  socket.on('alert_resolved', () => {
    loadBadges();
    if (currentPage === 'alerts') navigate('alerts');
  });

  socket.on('new_announcement', (ann) => {
    toast(`📢 ${ann.title}`);
    if (currentPage === 'announcements') navigate('announcements');
  });

  socket.on('chat_message', (msg) => {
    if (currentPage === 'chat' && msg.service === currentChatService) {
      appendChatMessage(msg);
    }
  });

  socket.on('new_deduction', (ded) => {
    if (['hotel_admin','chef_service','super_admin'].includes(currentUser.role)) {
      toast(`🧾 Déduction : ${ded.client_name} — ${ded.amount.toFixed(2)} €`);
      loadBadges();
    }
    if (currentPage === 'deductions') navigate('deductions');
  });

  socket.on('deduction_reviewed', () => {
    loadBadges();
    if (currentPage === 'deductions') navigate('deductions');
  });

  socket.on('new_maintenance', (m) => {
    toast(`🔧 Maintenance : ${m.location}`);
    if (currentPage === 'maintenance') navigate('maintenance');
  });
}

async function loadBadges() {
  try {
    // Alert badge
    const alerts = await api('/api/alerts?active=1');
    const aCount = alerts.length;
    const ab = document.getElementById('badge-alerts');
    ab.textContent = aCount; ab.style.display = aCount > 0 ? '' : 'none';

    // Deduction badge (pending, for managers)
    if (['hotel_admin','chef_service','super_admin'].includes(currentUser.role)) {
      const deds = await api('/api/deductions?status=pending');
      const dCount = deds.length;
      const db2 = document.getElementById('badge-deductions');
      db2.textContent = dCount; db2.style.display = dCount > 0 ? '' : 'none';
    }
  } catch {}
}

// ── NAVIGATION ────────────────────────────────────────────────────────────

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = [...document.querySelectorAll('.nav-item')].find(el => el.getAttribute('onclick') === `navigate('${page}')`);
  if (navItem) navItem.classList.add('active');
  document.getElementById('topbar-title').textContent = {
    dashboard: 'Dashboard',
    briefing: 'Briefing quotidien',
    alerts: 'Alertes urgentes',
    announcements: 'Annonces',
    chat: 'Chat',
    deductions: 'Déductions',
    handovers: 'Passations de service',
    maintenance: 'Maintenance',
  }[page] || page;

  const pages = { dashboard, briefing, alerts, announcements, chat, deductions, handovers, maintenance };
  if (pages[page]) pages[page]();
}

// ── PAGES ─────────────────────────────────────────────────────────────────

async function dashboard() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="text-muted">Chargement...</div>';
  try {
    const [alertsActive, todayBriefing, dedSummary, anns, maint] = await Promise.all([
      api('/api/alerts?active=1'),
      api('/api/briefings'),
      api('/api/deductions/summary'),
      api('/api/announcements'),
      api('/api/maintenance?status=open')
    ]);

    const criticals = alertsActive.filter(a => a.priority === 'critical');
    let html = '';

    // Critical alerts banner
    if (criticals.length > 0) {
      html += criticals.map(a => `
        <div class="critical-alert">
          <div class="critical-alert-title">⚠ CRITIQUE · ${esc(a.title)}</div>
          <div class="critical-alert-msg">${esc(a.message)}</div>
        </div>
      `).join('');
    }

    // Stats row

  return `<div class="list-item">

      <div class="list-item-sub">${esc(a.message)}</div>
      <div class="list-item-meta">
        <span>${esc(a.author_name || '—')}</span>

        ${a.resolved_at ? `<span>Résolue par ${esc(a.resolver_name || '—')}</span>` : ''}

      <button class="btn btn-green btn-sm" onclick="resolveAlert(${a.id})">✓ Résoudre</button>

async function chat() {
  const content = document.getElementById('content');
  const services = [
    {id:'general',label:'Général'},{id:'reception',label:'Réception'},
    {id:'housekeeping',label:'Housekeeping'},{id:'fb',label:'F&B'},
    {id:'maintenance',label:'Maintenance'},{id:'direction',label:'Direction'}
  ];

  content.innerHTML = `
    <div id="chat-container">
      <div class="chat-channels">${services.map(s =>
        `<button class="channel-btn ${s.id === currentChatService ? 'active' : ''}" onclick="switchChannel('${s.id}')">${s.label}</button>`
      ).join('')}</div>
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Message…" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-gold" onclick="sendChat()">Envoyer</button>
      </div>
    </div>
  `;
  await loadChatMessages();
}

async function loadChatMessages() {
  const box = document.getElementById('chat-messages');
  if (!box) return;
  box.innerHTML = '<div class="text-muted" style="padding:12px">Chargement…</div>';
  try {
    const msgs = await api(`/api/chat/messages?service=${currentChatService}&limit=60`);
    box.innerHTML = '';
    if (msgs.length === 0) {
      box.innerHTML = '<div class="empty-state"><div>Aucun message dans ce canal</div></div>';
    } else {
      msgs.forEach(m => appendChatMessage(m));
    }
    box.scrollTop = box.scrollHeight;
  } catch { box.innerHTML = '<div class="empty-state">Erreur</div>'; }
}

function appendChatMessage(msg) {
  const box = document.getElementById('chat-messages');
  if (!box) return;
  const own = msg.user_id === currentUser.id;
  const div = document.createElement('div');
  div.className = `chat-msg ${own ? 'own' : ''}`;
  div.innerHTML = `
    <div class="chat-msg-bubble">${esc(msg.message)}</div>
    <div class="chat-msg-meta">${own ? '' : `<strong>${esc(msg.author_name)}</strong> · `}${formatDate(msg.created_at)}</div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function switchChannel(service) {
  currentChatService = service;
  document.querySelectorAll('.channel-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === ({
    general:'Général',reception:'Réception',housekeeping:'Housekeeping',
    fb:'F&B',maintenance:'Maintenance',direction:'Direction'
  }[service])));
  await loadChatMessages();
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg || !socket) return;
  socket.emit('chat_message', { service: currentChatService, message: msg });
  input.value = '';
}

function openHandoverModal() {
  openModal('Nouvelle passation de service',
    `<div class="fields-row c2">
       <div class="field"><label>Shift</label>
         <select id="m-ho-shift">
           <option value="matin">Matin</option>
           <option value="apres_midi">Après-midi</option>
           <option value="nuit">Nuit</option>
         </select>
       </div>
       <div class="field"><label>Service</label>
         <select id="m-ho-service">
           <option value="reception">Réception</option>
           <option value="housekeeping">Housekeeping</option>
           <option value="fb">F&B</option>
           <option value="maintenance">Maintenance</option>
           <option value="general">Général</option>
         </select>
       </div>
     </div>
     <div class="field"><label>Contenu de la passation</label>
       <textarea id="m-ho-content" placeholder="Informations à transmettre au shift suivant…" style="min-height:120px"></textarea>
     </div>`,
    [{ label: 'Enregistrer', cls: 'btn-gold', action: submitHandover }]
  );
}

async function submitHandover() {
  const content2 = document.getElementById('m-ho-content').value.trim();
  const shift = document.getElementById('m-ho-shift').value;
  const service = document.getElementById('m-ho-service').value;
  if (!content2) { toast('Contenu requis', 'error'); return; }
  try {
    await api('/api/handovers', 'POST', { content: content2, shift, service });
    closeModal(); toast('Passation enregistrée ✓', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function maintenance() {
  const content = document.getElementById('content');
  const canUpdate = ['hotel_admin','chef_service','super_admin'].includes(currentUser.role);
  try {
    const list = await api('/api/maintenance');
    let html = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <h2 class="page-title" style="margin:0;flex:1">Maintenance</h2>
      <button class="btn btn-gold" onclick="openMaintModal()">+ Bon de travaux</button>
    </div>`;

    const open = list.filter(m => m.status !== 'done');
    const done = list.filter(m => m.status === 'done');

    if (open.length === 0) {
      html += `<div class="empty-state"><div class="icon">✅</div><div>Aucun ticket ouvert</div></div>`;
    } else {
      html += `<div class="card"><div class="card-title"><span>En cours / Ouverts</span></div>`;
      html += open.map(m => maintItem(m, canUpdate)).join('');
      html += `</div>`;
    }

    if (done.length > 0) {
      html += `<div class="card"><div class="card-title"><span>Résolus récemment</span></div>`;
      html += done.slice(0, 5).map(m => maintItem(m, false)).join('');
      html += `</div>`;
    }

    content.innerHTML = html;
  } catch { content.innerHTML = '<div class="empty-state">Erreur</div>'; }
}

function maintItem(m, canUpdate) {
  return `<div class="list-item">
    <div class="list-item-body">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="list-item-title">${esc(m.location)}</span>
        <span class="badge badge-${m.priority}">${m.priority}</span>
        <span class="badge badge-${m.status}">${{open:'Ouvert',in_progress:'En cours',done:'Résolu'}[m.status]}</span>
      </div>
      <div class="list-item-sub">${esc(m.description)}</div>
      <div class="list-item-meta">
        <span>Par ${esc(m.creator_name || '—')}</span>
        <span>${formatDate(m.created_at)}</span>
        ${m.assignee_name ? `<span>→ ${esc(m.assignee_name)}</span>` : ''}
      </div>
    </div>
    ${canUpdate && m.status !== 'done' ? `<div class="list-item-actions">
      ${m.status === 'open' ? `<button class="btn btn-outline btn-sm" onclick="updateMaint(${m.id},'in_progress')">En cours</button>` : ''}
      <button class="btn btn-green btn-sm" onclick="updateMaint(${m.id},'done')">✓ Résolu</button>
    </div>` : ''}
  </div>`;
}

function openMaintModal() {
  openModal('Nouveau bon de travaux',
    `<div class="field"><label>Lieu / Chambre</label><input id="m-maint-loc" placeholder="Ex: Ch. 302, Couloir 3ème, Cuisine"></div>
     <div class="field"><label>Description du problème</label><textarea id="m-maint-desc" placeholder="Décrivez le problème…" style="min-height:80px"></textarea></div>
     <div class="field"><label>Priorité</label>
       <select id="m-maint-prio">
         <option value="low">Faible</option>
         <option value="medium" selected>Moyenne</option>
         <option value="high">Haute</option>
         <option value="urgent">URGENT</option>
       </select>
     </div>`,
    [{ label: 'Créer le bon', cls: 'btn-gold', action: submitMaint }]
  );
}

async function submitMaint() {
  const location = document.getElementById('m-maint-loc').value.trim();
  const description = document.getElementById('m-maint-desc').value.trim();
  const priority = document.getElementById('m-maint-prio').value;
  if (!location || !description) { toast('Lieu et description requis', 'error'); return; }
  try {
    await api('/api/maintenance', 'POST', { location, description, priority });
    closeModal(); toast('Bon créé ✓', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function updateMaint(id, status) {
  try {
    await api(`/api/maintenance/${id}`, 'PATCH', { status });
    toast(status === 'done' ? 'Résolu ✓' : 'Mis à jour', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

// ── MODAL ─────────────────────────────────────────────────────────────────

function openModal(title, body, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  const footer = document.getElementById('modal-footer');
  footer.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = `btn ${b.cls}`;
    btn.textContent = b.label;
    btn.onclick = b.action;
    footer.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('visible');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('visible');
}

// ── UTILS ─────────────────────────────────────────────────────────────────

async function api(url, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Erreur réseau');
  return data;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
         d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

function formatDateFr(dateStr) {
  if (!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  const months = ['','janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d)} ${months[parseInt(m)]} ${y}`;
}

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3000);
}

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

checkAuth();
