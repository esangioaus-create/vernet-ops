<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vernet Ops</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── THEME TOKENS ─────────────────────────────────────────────────────── */
:root {
  --gold:#c9a84c;--gold-light:#e8c87a;--gold-dim:#8a6e30;--gold-ultra-dim:#2a2010;
  --transition: .2s cubic-bezier(.4,0,.2,1);
  --r:10px;--r2:14px;--r3:20px;
  --sidebar-w:230px;
  --font: 'Inter', -apple-system, sans-serif;
}

[data-theme="dark"] {
  --bg:#0a0908;--bg2:#111009;--bg3:#18160f;--bg4:#201d14;--bg5:#28251a;
  --text:#ede5d0;--text2:#a89878;--text3:#6b5c3e;--text4:#3d3020;
  --border:#201d14;--border2:#2e2a1e;--border3:#3d3828;
  --red:#d94f4f;--red-bg:#1f0f0f;--red-dim:#7a2020;
  --green:#4a9460;--green-bg:#0d1f14;--green-dim:#1e4a2a;
  --blue:#4a80c8;--blue-bg:#0d1520;
  --orange:#c87830;--orange-bg:#1f1408;
  --shadow: 0 4px 24px rgba(0,0,0,.5);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
}

[data-theme="light"] {
  --bg:#f5f0e8;--bg2:#ffffff;--bg3:#faf7f2;--bg4:#f0ebe0;--bg5:#e8e2d5;
  --text:#1a1510;--text2:#5a4e38;--text3:#8a7a60;--text4:#c0b090;
  --border:#e0d8c8;--border2:#d0c8b5;--border3:#bfb5a0;
  --red:#c03030;--red-bg:#fdf0f0;--red-dim:#f5d0d0;
  --green:#2a7a48;--green-bg:#f0faf4;--green-dim:#c8ecd8;
  --blue:#2a60a8;--blue-bg:#f0f5ff;
  --orange:#a85020;--orange-bg:#fff5ee;
  --shadow: 0 4px 24px rgba(0,0,0,.1);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.08);
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── LOGIN ───────────────────────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#login-screen.hidden{display:none}
.login-wrap{width:100%;max-width:360px;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:40px 36px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .logo-mark{width:52px;height:52px;background:linear-gradient(135deg,var(--gold-dim),var(--gold));border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.login-logo .name{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px}
.login-logo .sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.login-field input{width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:var(--transition)}
.login-field input:focus{border-color:var(--gold-dim);background:var(--bg4)}
.login-btn{width:100%;padding:12px;background:var(--gold);color:#0a0908;font-weight:700;font-size:14px;letter-spacing:.5px;border:none;border-radius:var(--r);cursor:pointer;transition:var(--transition);margin-top:6px;font-family:var(--font)}
.login-btn:hover{background:var(--gold-light);transform:translateY(-1px);box-shadow:0 4px 16px rgba(201,168,76,.3)}
.login-btn:active{transform:translateY(0)}
.login-error{color:var(--red);font-size:12px;text-align:center;margin-top:10px;min-height:18px;font-weight:500}
.login-theme{position:absolute;top:16px;right:16px}

/* ── APP LAYOUT ──────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}
#app.hidden{display:none}

/* Sidebar */
#sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:var(--transition)}
.sb-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sb-hotel{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user{font-size:11px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-badge{display:inline-block;padding:1px 6px;background:var(--gold-ultra-dim);border:1px solid var(--gold-dim);border-radius:8px;font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-section{padding:16px 18px 5px;font-size:10px;font-weight:700;color:var(--text4);letter-spacing:2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:var(--text3);transition:var(--transition);border-left:2px solid transparent;user-select:none;border-radius:0}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--gold-ultra-dim);color:var(--gold);border-left-color:var(--gold)}
.nav-item .ico{font-size:14px;width:18px;text-align:center;flex-shrink:0;opacity:.8}
.nav-item .lbl{font-size:13px;font-weight:500}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.sb-footer{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.theme-toggle{width:34px;height:34px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:var(--transition);flex-shrink:0}
.theme-toggle:hover{border-color:var(--gold-dim);background:var(--bg4)}
.logout-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);color:var(--text3);cursor:pointer;font-size:12px;font-weight:500;transition:var(--transition);font-family:var(--font)}
.logout-btn:hover{border-color:var(--red-dim);color:var(--red)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar-title{font-size:15px;font-weight:700;color:var(--text)}
#topbar-date{margin-left:auto;font-size:12px;color:var(--text3);font-weight:500}
#topbar-actions{display:flex;gap:8px}
#content{flex:1;overflow-y:auto;padding:22px}

/* ── COMPONENTS ──────────────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:14px;transition:var(--transition)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:var(--text)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Stats */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px;text-align:center;transition:var(--transition)}
.stat-card:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.stat-val{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat-label{font-size:10px;font-weight:600;color:var(--text3);margin-top:6px;letter-spacing:1px;text-transform:uppercase}

/* Buttons */
.btn{padding:8px 16px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;font-family:var(--font);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#0a0908}.btn-gold:hover{background:var(--gold-light);box-shadow:0 4px 12px rgba(201,168,76,.25)}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--gold-dim);color:var(--text);background:var(--bg3)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-dim)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-green{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-dim)}.btn-green:hover{background:var(--green);color:#fff}
.btn-ghost{background:transparent;border:none;color:var(--text3)}.btn-ghost:hover{color:var(--text);background:var(--bg3)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:var(--transition);font-family:var(--font)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-dim);background:var(--bg4)}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field select option{background:var(--bg3)}
.fields-row{display:grid;gap:12px}
.fields-row.c2{grid-template-columns:1fr 1fr}
.fields-row.c3{grid-template-columns:1fr 1fr 1fr}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-pending{background:var(--orange-bg);color:var(--orange)}
.badge-approved{background:var(--green-bg);color:var(--green)}
.badge-rejected{background:var(--red-bg);color:var(--red)}
.badge-critical{background:var(--red);color:#fff}
.badge-high{background:var(--red-bg);color:var(--red)}
.badge-medium{background:var(--orange-bg);color:var(--orange)}
.badge-low{background:var(--bg4);color:var(--text3)}
.badge-open{background:var(--blue-bg);color:var(--blue)}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge-in_progress{background:var(--orange-bg);color:var(--orange)}
.badge-super_admin{background:linear-gradient(135deg,var(--gold-dim),var(--gold));color:#0a0908}
.badge-hotel_admin{background:var(--blue-bg);color:var(--blue)}
.badge-chef_service{background:var(--orange-bg);color:var(--orange)}
.badge-equipe{background:var(--bg4);color:var(--text3)}

/* List items */
.list-item{padding:13px 16px;background:var(--bg3);border-radius:var(--r);margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;transition:var(--transition);border:1px solid transparent}
.list-item:hover{background:var(--bg4);border-color:var(--border)}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-item-sub{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
.list-item-meta{font-size:11px;color:var(--text3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list-item-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:var(--transition)}
.modal-overlay.visible{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:28px;width:520px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);transform:translateY(8px);transition:var(--transition)}
.modal-overlay.visible .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-title{font-size:16px;font-weight:700;color:var(--gold)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;line-height:1;border-radius:6px;transition:var(--transition)}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}

/* Chat */
#chat-container{display:flex;flex-direction:column;height:calc(100vh - 152px);gap:12px}
.chat-channels{display:flex;gap:6px;flex-wrap:wrap}
.channel-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-size:12px;font-weight:600;transition:var(--transition);font-family:var(--font)}
.channel-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.channel-btn.active{background:var(--gold);color:#0a0908;border-color:var(--gold)}
#chat-messages{flex:1;overflow-y:auto;background:var(--bg3);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:100px;border:1px solid var(--border)}
.chat-msg{display:flex;flex-direction:column;max-width:75%}
.chat-msg.own{align-self:flex-end;align-items:flex-end}
.chat-bubble{padding:9px 13px;border-radius:14px;background:var(--bg4);font-size:13px;line-height:1.5;border:1px solid var(--border)}
.chat-msg.own .chat-bubble{background:var(--gold-ultra-dim);border-color:var(--gold-dim);color:var(--text)}
.chat-meta{font-size:10px;color:var(--text3);margin-top:3px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:10px 14px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:var(--transition);font-family:var(--font)}
.chat-input-row input:focus{border-color:var(--gold-dim)}

/* Critical alert banner */
.critical-banner{background:var(--red-bg);border:1px solid var(--red-dim);border-radius:var(--r);padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.critical-dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
.critical-text{flex:1}
.critical-title{font-size:13px;font-weight:700;color:var(--red)}
.critical-msg{font-size:12px;color:var(--text2);margin-top:2px}

/* File upload */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:var(--transition);position:relative}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--gold-dim);background:var(--gold-ultra-dim)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone .ico{font-size:24px;margin-bottom:8px}
.upload-zone .txt{font-size:12px;color:var(--text3)}
.attach-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.attach-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border)}
.attach-item .ico{font-size:16px;flex-shrink:0}
.attach-item .name{flex:1;font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-item .size{font-size:11px;color:var(--text3);flex-shrink:0}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;background:var(--bg3);color:var(--text3);font-weight:600;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
.amount{font-weight:700;color:var(--gold);font-family:monospace;font-size:13px}

/* Briefing editor */
#briefing-editor{width:100%;min-height:220px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;line-height:1.8;padding:16px;resize:vertical;outline:none;font-family:var(--font);transition:var(--transition)}
#briefing-editor:focus{border-color:var(--gold-dim)}
.briefing-content{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap}
.briefing-date{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}

/* User management */
.user-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;transition:var(--transition);margin-bottom:8px}
.user-card:hover{border-color:var(--border2);background:var(--bg4)}
.user-avatar{width:38px;height:38px;border-radius:10px;background:var(--gold-ultra-dim);border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--gold);flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:var(--text)}
.user-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-inactive{opacity:.5}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 18px;font-size:13px;font-weight:500;color:var(--text);z-index:999;transform:translateY(80px);opacity:0;transition:.3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:var(--shadow);max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:var(--green-dim);color:var(--green)}
#toast.error{border-color:var(--red-dim);color:var(--red)}

/* Utils */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-ico{font-size:36px;margin-bottom:12px;opacity:.5}
.empty-txt{font-size:14px}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-gold{color:var(--gold)}
.text-muted{color:var(--text3)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--bg4);border-radius:20px;font-size:11px;color:var(--text3);border:1px solid var(--border)}
.scroll-area{overflow-y:auto}

/* Responsive */
@media(max-width:768px){
  #sidebar{display:none;position:fixed;inset:0 auto 0 0;z-index:150;width:260px}
  #sidebar.open{display:flex}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .fields-row.c2,.fields-row.c3{grid-template-columns:1fr}
  #content{padding:14px}
}

/* Animations */
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fade-up .3s ease forwards}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <button class="theme-toggle login-theme" onclick="toggleTheme()" title="Thème">🌙</button>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">🏨</div>
        <div class="name">Vernet Ops</div>
        <div class="sub">B Signature Hôtels &amp; Resorts</div>
      </div>
      <div class="login-field"><label>Identifiant</label><input type="text" id="login-user" autocomplete="username" placeholder="ex: etienne"></div>
      <div class="login-field"><label>Mot de passe</label><input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="login-btn" onclick="doLogin()">Se connecter</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div class="sb-header">
      <div class="sb-hotel" id="sb-hotel">—</div>
      <div class="sb-user" id="sb-user">—</div>
      <div id="sb-badge"></div>
    </div>
    <nav class="sb-nav">
      <div class="nav-section">Opérations</div>
      <div class="nav-item active" onclick="navigate('dashboard')"><span class="ico">◼</span><span class="lbl">Dashboard</span></div>
      <div class="nav-item" onclick="navigate('briefing')"><span class="ico">📋</span><span class="lbl">Briefing</span></div>
      <div class="nav-item" onclick="navigate('alerts')"><span class="ico">🔴</span><span class="lbl">Alertes</span><span class="nav-badge" id="badge-alerts" style="display:none">0</span></div>
      <div class="nav-item" onclick="navigate('announcements')"><span class="ico">📢</span><span class="lbl">Annonces</span></div>
      <div class="nav-item" onclick="navigate('chat')"><span class="ico">💬</span><span class="lbl">Chat</span></div>
      <div class="nav-section">Contrôle</div>
      <div class="nav-item" onclick="navigate('deductions')"><span class="ico">🧾</span><span class="lbl">Déductions</span><span class="nav-badge" id="badge-deductions" style="display:none">0</span></div>
      <div class="nav-item" onclick="navigate('handovers')"><span class="ico">🔄</span><span class="lbl">Passations</span></div>
      <div class="nav-item" onclick="navigate('maintenance')"><span class="ico">🔧</span><span class="lbl">Maintenance</span></div>
      <div class="nav-section admin-only" style="display:none">Administration</div>
      <div class="nav-item admin-only" style="display:none" onclick="navigate('users')"><span class="ico">👥</span><span class="lbl">Utilisateurs</span></div>
    </nav>
    <div class="sb-footer">
      <button class="theme-toggle" onclick="toggleTheme()" title="Thème clair/sombre" id="theme-btn">🌙</button>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <div id="topbar-title">Dashboard</div>
      <div id="topbar-date"></div>
      <div id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">—</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let currentUser = null;
let socket = null;
let currentPage = 'dashboard';
let currentChatService = 'general';
let currentTheme = localStorage.getItem('theme') || 'dark';

// ── THEME ──────────────────────────────────────────────────────────────────
function applyTheme(t) {
  currentTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  const ico = t === 'dark' ? '☀️' : '🌙';
  document.querySelectorAll('#theme-btn').forEach(b => b.textContent = ico);
}

function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }
applyTheme(currentTheme);

// ── AUTH ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    currentUser = await api('/api/auth/login', 'POST', { username: u, password: p });
    startApp();
  } catch(e) { err.textContent = e.message || 'Erreur de connexion'; }
}

async function doLogout() {
  await api('/api/auth/logout', 'POST').catch(() => {});
  currentUser = null;
  if (socket) socket.disconnect();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-pass').value = '';
}

async function checkAuth() {
  try { currentUser = await api('/api/auth/me'); startApp(); } catch {}
}

// ── APP START ─────────────────────────────────────────────────────────────
function startApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sb-hotel').textContent = currentUser.hotel_name || 'B Signature';
  document.getElementById('sb-user').textContent = currentUser.display_name;
  document.getElementById('sb-badge').innerHTML = `<span class="sb-badge">${roleLabel(currentUser.role)}</span>`;

  if (['super_admin'].includes(currentUser.role)) {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  }

  initSocket();
  updateDate();
  setInterval(updateDate, 60000);
  navigate('dashboard');
  loadBadges();
  setInterval(loadBadges, 30000);
}

function updateDate() {
  const d = new Date();
  const days = ['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];
  const months = ['jan','fév','mars','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  document.getElementById('topbar-date').textContent =
    `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function roleLabel(r) {
  return {super_admin:'Super Admin',hotel_admin:'Admin',chef_service:'Chef svc.',equipe:'Équipe'}[r] || r;
}
function serviceLbl(s) {
  return {general:'Général',reception:'Réception',housekeeping:'HK',fb:'F&B',maintenance:'Maint.',direction:'Direction'}[s] || (s||'—');
}
function priorityLbl(p) {
  return {low:'Faible',medium:'Moyenne',high:'Haute',high:'Haute',urgent:'Urgent',critical:'Critique'}[p] || p;
}

// ── SOCKET ────────────────────────────────────────────────────────────────
function initSocket() {
  socket = io();
  socket.on('new_alert', (a) => {
    toast(`⚠ ${a.title}`, a.priority === 'critical' ? 'error' : '');
    loadBadges();
    if (['dashboard','alerts'].includes(currentPage)) navigate(currentPage);
  });
  socket.on('alert_resolved', () => { loadBadges(); if (['dashboard','alerts'].includes(currentPage)) navigate(currentPage); });
  socket.on('new_announcement', (a) => { toast(`📢 ${a.title}`); if (currentPage === 'announcements') navigate('announcements'); });
  socket.on('chat_message', (msg) => {
    if (currentPage === 'chat' && msg.service === currentChatService) appendChatMsg(msg);
  });
  socket.on('new_deduction', (d) => {
    if (['hotel_admin','chef_service','super_admin'].includes(currentUser.role)) {
      toast(`🧾 Déduction : ${d.client_name} — ${parseFloat(d.amount).toFixed(2)} €`);
      loadBadges();
    }
    if (currentPage === 'deductions') navigate('deductions');
  });
  socket.on('deduction_reviewed', () => { loadBadges(); if (currentPage === 'deductions') navigate('deductions'); });
  socket.on('new_maintenance', (m) => { toast(`🔧 ${m.location}`); if (currentPage === 'maintenance') navigate('maintenance'); });
}

async function loadBadges() {
  try {
    const alerts = await api('/api/alerts?active=1');
    const ab = document.getElementById('badge-alerts');
    ab.textContent = alerts.length; ab.style.display = alerts.length ? '' : 'none';
    if (['hotel_admin','chef_service','super_admin'].includes(currentUser.role)) {
      const deds = await api('/api/deductions?status=pending');
      const db2 = document.getElementById('badge-deductions');
      db2.textContent = deds.length; db2.style.display = deds.length ? '' : 'none';
    }
  } catch {}
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const found = [...document.querySelectorAll('.nav-item')].find(el => el.getAttribute('onclick') === `navigate('${page}')`);
  if (found) found.classList.add('active');
  const titles = {dashboard:'Dashboard',briefing:'Briefing quotidien',alerts:'Alertes urgentes',announcements:'Annonces',chat:'Chat',deductions:'Déductions',handovers:'Passations de service',maintenance:'Maintenance',users:'Gestion des utilisateurs'};
  document.getElementById('topbar-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  const pages = {dashboard,briefing,alerts,announcements,chat,deductions,handovers,maintenance,users};
  if (pages[page]) pages[page]();
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────
async function dashboard() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="text-muted" style="padding:20px">Chargement...</div>';
  try {
    const [activeAlerts, todayBriefing, dedSummary, anns, maint] = await Promise.all([
      api('/api/alerts?active=1'), api('/api/briefings'),
      api('/api/deductions/summary'), api('/api/announcements'),
      api('/api/maintenance?status=open')
    ]);

    let html = '<div class="fade-up">';

    // Critical banners
    activeAlerts.filter(a => a.priority === 'critical').forEach(a => {
      html += `<div class="critical-banner"><div class="critical-dot"></div><div class="critical-text"><div class="critical-title">⚠ CRITIQUE — ${esc(a.title)}</div><div class="critical-msg">${esc(a.message)}</div></div><button class="btn btn-sm btn-outline" onclick="resolveAlert(${a.id})">Résoudre</button></div>`;
    });

    // Stats
    html += `<div class="grid-4" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-val" style="color:${activeAlerts.length > 0 ? 'var(--red)' : 'var(--green)'}">${activeAlerts.length}</div><div class="stat-label">Alertes actives</div></div>
      <div class="stat-card"><div class="stat-val" style="color:${(dedSummary.pending||0) > 0 ? 'var(--orange)' : 'var(--text3)'}">${dedSummary.pending||0}</div><div class="stat-label">Déductions en attente</div></div>
      <div class="stat-card"><div class="stat-val">${maint.length}</div><div class="stat-label">Maintenance ouverte</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--gold)">${(dedSummary.total_approved_amount||0).toFixed(0)} €</div><div class="stat-label">Déductions approuvées</div></div>
    </div>`;

    html += '<div class="grid-2">';

    // Briefing
    html += `<div class="card"><div class="card-header"><div class="card-title">📋 Briefing du jour</div><button class="btn btn-outline btn-sm" onclick="navigate('briefing')">Voir →</button></div>`;
    if (todayBriefing) {
      const prev = todayBriefing.content.length > 220 ? todayBriefing.content.substring(0,220)+'…' : todayBriefing.content;
      html += `<div class="briefing-content">${esc(prev)}</div><div class="briefing-date" style="margin-top:10px">Par ${esc(todayBriefing.author_name||'—')}</div>`;
    } else {
      html += `<div class="empty-state" style="padding:20px"><div class="empty-ico">📋</div><div class="empty-txt">Aucun briefing aujourd'hui</div></div>`;
    }
    html += `</div>`;

    // Annonces
    html += `<div class="card"><div class="card-header"><div class="card-title">📢 Annonces</div><button class="btn btn-outline btn-sm" onclick="navigate('announcements')">Voir →</button></div>`;
    if (!anns.length) {
      html += `<div class="empty-state" style="padding:20px"><div class="empty-ico">📢</div><div class="empty-txt">Aucune annonce</div></div>`;
    } else {
      html += anns.slice(0,3).map(a => `<div class="list-item" style="cursor:default"><div class="list-item-body"><div class="list-item-title">${a.pinned?'📌 ':''}${esc(a.title)}</div><div class="list-item-sub">${esc(a.content.substring(0,80))}${a.content.length>80?'…':''}</div></div></div>`).join('');
    }
    html += `</div></div>`;

    // Alertes actives (non critiques)
    const nonCritical = activeAlerts.filter(a => a.priority !== 'critical');
    if (nonCritical.length) {
      html += `<div class="card"><div class="card-header"><div class="card-title">🔴 Alertes actives</div><button class="btn btn-outline btn-sm" onclick="navigate('alerts')">Gérer →</button></div>`;
      html += nonCritical.slice(0,3).map(a => `<div class="list-item"><div class="list-item-body"><div class="list-item-title">${esc(a.title)}<span class="badge badge-${a.priority}">${priorityLbl(a.priority)}</span></div><div class="list-item-sub">${esc(a.message)}</div></div></div>`).join('');
      html += `</div>`;
    }

    html += '</div>';
    c.innerHTML = html;
  } catch(e) { c.innerHTML = `<div class="empty-state"><div class="empty-ico">⚠</div><div>Erreur de chargement</div></div>`; }
}

// ── BRIEFING ──────────────────────────────────────────────────────────────
async function briefing() {
  const c = document.getElementById('content');
  const canEdit = ['hotel_admin','super_admin','chef_service'].includes(currentUser.role);
  try {
    const [current, recent] = await Promise.all([api('/api/briefings'), api('/api/briefings/recent')]);
    let html = '<div class="grid-2 fade-up">';
    html += `<div class="card"><div class="card-header"><div class="card-title">📋 Aujourd'hui</div>${canEdit ? '<button class="btn btn-gold btn-sm" onclick="saveBriefing()">💾 Enregistrer</button>' : ''}</div>`;
    if (canEdit) {
      html += `<textarea id="briefing-editor" placeholder="Saisissez le briefing du jour…">${current ? esc(current.content) : ''}</textarea>`;
    } else {
      html += current
        ? `<div class="briefing-date">Par ${esc(current.author_name||'—')}</div><div class="briefing-content">${esc(current.content)}</div>`
        : `<div class="empty-state" style="padding:20px"><div class="empty-ico">📋</div><div>Aucun briefing</div></div>`;
    }
    html += `</div><div class="card"><div class="card-header"><div class="card-title">Historique</div></div>`;
    if (!recent.length) {
      html += `<div class="empty-state" style="padding:20px"><div>Aucun historique</div></div>`;
    } else {
      html += recent.map(b => `<div class="list-item" style="cursor:pointer" onclick="showBriefingDetail('${esc(b.date)}',\`${esc(b.content).replace(/`/g,'\\`')}\`,'${esc(b.author_name||'')}')"><div class="list-item-body"><div class="list-item-title">${formatDateFr(b.date)}</div><div class="list-item-sub">${esc(b.content.substring(0,80))}${b.content.length>80?'…':''}</div><div class="list-item-meta"><span>Par ${esc(b.author_name||'—')}</span></div></div></div>`).join('');
    }
    html += `</div></div>`;
    c.innerHTML = html;
  } catch { c.innerHTML = '<div class="empty-state">Erreur</div>'; }
}

async function saveBriefing() {
  const content = document.getElementById('briefing-editor')?.value.trim();
  if (!content) { toast('Contenu vide', 'error'); return; }
  try { await api('/api/briefings','POST',{content}); toast('Briefing enregistré ✓','success'); } catch(e) { toast(e.message,'error'); }
}

function showBriefingDetail(date, content, author) {
  openModal(`Briefing — ${formatDateFr(date)}`, `<div class="briefing-date">Par ${esc(author||'—')}</div><div class="briefing-content" style="margin-top:12px">${esc(content)}</div>`, []);
}

// ── ALERTS ────────────────────────────────────────────────────────────────
async function alerts() {
  const c = document.getElementById('content');
  const canCreate = ['hotel_admin','super_admin','chef_service'].includes(currentUser.role);
  document.getElementById('topbar-actions').innerHTML = canCreate ? `<button class="btn btn-gold btn-sm" onclick="openAlertModal()">+ Alerte</button>` : '';
  try {
    const list = await api('/api/alerts');
    let html = '<div class="fade-up">';
    if (!list.length) {
      html += `<div class="empty-state"><div class="empty-ico">✅</div><div class="empty-txt">Aucune alerte</div></div>`;
    } else {
      const active = list.filter(a => !a.resolved_at);
      const resolved = list.filter(a => a.resolved_at);
      if (active.length) {
        html += `<div class="card"><div class="card-title" style="margin-bottom:14px">Actives</div>`;
        html += active.map(a => alertItem(a, canCreate)).join('');
        html += `</div>`;
      }
      if (resolved.length) {
        html += `<div class="card"><div class="card-title" style="margin-bottom:14px">Résolues récemment</div>`;
        html += resolved.slice(0,8).map(a => alertItem(a, false)).join('');
        html += `</div>`;
      }
    }
    html += '</div>';
    c.innerHTML = html;
  } catch { c.innerHTML = '<div class="empty-state">Erreur</div>'; }
}

function alertItem(a, canResolve) {
  return `<div class="list-item"><div class="list-item-body"><div class="list-item-title">${esc(a.title)}<span class="badge badge-${a.priority}">${priorityLbl(a.priority)}</span>${a.resolved_at?'<span class="badge badge-done">Résolue</span>':''}</div><div class="list-item-sub">${esc(a.message)}</div><div class="list-item-meta"><span>${esc(a.author_name||'—')}</span><span>${formatDate(a.created_at)}</span>${a.resolved_at?`<span>Résolue par ${esc(a.resolver_name||'—')}</span>`:''}</div></div>${canResolve&&!a.resolved_at?`<div class="list-item-actions"><button class="btn btn-green btn-sm" onclick="resolveAlert(${a.id})">✓ Résoudre</button></div>`:''}</div>`;
}

async function resolveAlert(id) {
  try { await api(`/api/alerts/${id}/resolve`,'PATCH',{}); toast('Alerte résolue ✓','success'); } catch(e) { toast(e.message,'error'); }
}

function openAlertModal() {
  openModal('Nouvelle alerte',
    `<div class="field"><label>Titre</label><input id="m-at" placeholder="Ex: Ascenseur HS"></div>
     <div class="field"><label>Message</label><textarea id="m-am"></textarea></div>
     <div class="field"><label>Priorité</label><select id="m-ap"><option value="low">Faible</option><option value="medium" selected>Moyenne</option><option value="high">Haute</option><option value="critical">🔴 CRITIQUE</option></select></div>`,
    [{label:'Envoyer',cls:'btn-gold',action:async()=>{
      const title=document.getElementById('m-at').value.trim();
      const message=document.getElementById('m-am').value.trim();
      const priority=document.getElementById('m-ap').value;
      if(!title||!message){toast('Titre et message requis','error');return;}
      await api('/api/alerts','POST',{title,message,priority});
      closeModal();toast('Alerte envoyée ✓','success');
    }}]
  );
}

// ── ANNOUNCEMENTS ─────────────────────────────────────────────────────────
async function announcements() {
  const c = document.getElementById('content');
  const canCreate = ['hotel_admin','super_admin','chef_service'].includes(currentUser.role);
  document.getElementById('topbar-actions').innerHTML = canCreate ? `<button class="btn btn-gold btn-sm" onclick="openAnnModal()">+ Annonce</button>` : '';
  try {
    const list = await api('/api/announcements');
    let html = '<div class="fade-up">';
    if (!list.length) {
      html += `<div class="empty-state"><div class="empty-ico">📢</div><div class="empty-txt">Aucune annonce</div></div>`;
    } else {
      html += list.map(a => `<div class="card" style="padding:16px 18px"><div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:14px;font-weight:600">${a.pinned?'📌 ':''}${esc(a.title)}</span></div><div style="font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap">${esc(a.content)}</div><div style="font-size:11px;color:var(--text3);margin-top:10px">Par ${esc(a.author_name||'—')} · ${formatDate(a.created_at)}</div></div>${canCreate?`<button class="btn btn-ghost btn-xs" onclick="deleteAnn(${a.id})">✕</button>`:''}</div></div>`).join('');
    }
    html += '</div>';
    c.innerHTML = html;
  } catch { c.innerHTML = '<div class="empty-state">Erreur</div>'; }
}

function openAnnModal() {
  openModal('Nouvelle annonce',
    `<div class="field"><label>Titre</label><input id="m-ant"></div>
     <div class="field"><label>Contenu</label><textarea id="m-anc" style="min-height:100px"></textarea></div>
     <div class="fields-row c2"><div class="field"><label>Épingler</label><select id="m-anp"><option value="0">Non</option><option value="1">Oui</option></select></div><div class="field"><label>Expiration</label><input type="date" id="m-ane"></div></div>`,
    [{label:'Publier',cls:'btn-gold',action:async()=>{
      const title=document.getElementById('m-ant').value.trim();
      const content=document.getElementById('m-anc').value.trim();
      if(!title||!content){toast('Titre et contenu requis','error');return;}
      await api('/api/announcements','POST',{title,content,pinned:document.getElementById('m-anp').value==='1',expires_at:document.getElementById('m-ane').value||null});
      closeModal();toast('Annonce publiée ✓','success');
    }}]
  );
}

async function deleteAnn(id) {
  if(!confirm('Supprimer ?')) return;
  await api(`/api/announcements/${id}`,'DELETE');
  navigate('announcements');
}

// ── CHAT ──────────────────────────────────────────────────────────────────
async function chat() {
  const c = document.getElementById('content');
  const services = await api('/api/chat/services');
  c.innerHTML = `<div id="chat-container"><div class="chat-channels">${services.map(s=>`<button class="channel-btn ${s.id===currentChatService?'active':''}" onclick="switchChannel('${s.id}')">${s.label}</button>`).join('')}</div><div id="chat-messages"><div class="text-muted" style="padding:12px">Chargement…</div></div><div class="chat-input-row"><input type="text" id="chat-input" placeholder="Message…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn btn-gold" onclick="sendChat()">Envoyer</button></div></div>`;
  loadChatMessages();
}

async function loadChatMessages() {
  const box = document.getElementById('chat-messages');
  if (!box) return;
  try {
    const msgs = await api(`/api/chat/messages?service=${currentChatService}&limit=60`);
    box.innerHTML = '';
    if (!msgs.length) { box.innerHTML = '<div class="empty-state"><div>Aucun message</div></div>'; return; }
    msgs.forEach(m => appendChatMsg(m));
    box.scrollTop = box.scrollHeight;
  } catch { box.innerHTML = '<div class="empty-state">Erreur</div>'; }
}

function appendChatMsg(msg) {
  const box = document.getElementById('chat-messages');
  if (!box) return;
  const own = msg.user_id === currentUser.id;
  const d = document.createElement('div');
  d.className = `chat-msg ${own?'own':''}`;
  d.innerHTML = `<div class="chat-bubble">${esc(msg.message)}</div><div class="chat-meta">${own?'':`<strong>${esc(msg.author_name)}</strong> · `}${formatDate(msg.created_at)}</div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function switchChannel(svc) {
  currentChatService = svc;
  document.querySelectorAll('.channel-btn').forEach(b => {
    const svcs = {general:'Général',reception:'Réception',housekeeping:'HK',fb:'F&B',maintenance:'Maint.',direction:'Direction'};
    b.classList.toggle('active', b.textContent.trim() === (svcs[svc]||svc));
  });
  await loadChatMessages();
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input?.value.trim();
  if (!msg || !socket) return;
  socket.emit('chat_message', { service: currentChatService, message: msg });
  input.value = '';
}

// ── DEDUCTIONS ────────────────────────────────────────────────────────────
async function deductions() {
  const c = document.getElementById('content');
  const canReview = ['hotel_admin','chef_service','super_admin'].includes(currentUser.role);
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-gold btn-sm" onclick="openDedModal()">+ Déduction</button>`;
  try {

  document.getElementById('file-preview').innerHTML = `<div class="attach-item" style="margin-top:8px"><span class="ico">${file.type==='application/pdf'?'📄':'🖼'}</span><span class="name">${esc(file.name)}</span><span class="size">${(file.size/1024).toFixed(0)} Ko</span></div>`;

async function submitDed() {
  const client_name=document.getElementById('m-dc').value.trim();
  const room=document.getElementById('m-dr').value.trim();
  const amount=document.getElementById('m-da').value;
  const reason=document.getElementById('m-dre').value.trim();
  if(!client_name||!room||!amount||!reason){toast('Champs obligatoires manquants','error');return;}
  try {
    const ded = await api('/api/deductions','POST',{
      client_name,room,amount,reason,
      opera_code:document.getElementById('m-dco').value.trim(),
      service:document.getElementById('m-ds').value,
      notes:document.getElementById('m-dn').value.trim(),
      date:document.getElementById('m-dd').value
    });
    // Upload file if present
    const fileInput = document.getElementById('m-file');
    if (fileInput?.files[0]) {
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      await fetch(`/api/deductions/${ded.id}/attachments`, {
        method:'POST', body:fd, credentials:'same-origin'
      });
    }
    closeModal();toast('Demande soumise ✓','success');
  } catch(e) { toast(e.message,'error'); }
}

async function reviewDed(id, status) {
  const comment = status === 'rejected' ? prompt('Motif du refus (optionnel) :') : null;
  try {
    await api(`/api/deductions/${id}/review`,'PATCH',{status,review_comment:comment});
    toast(status==='approved'?'Approuvée ✓':'Refusée','success');
  } catch(e) { toast(e.message,'error'); }
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(title, body, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  const footer = document.getElementById('modal-footer');
  footer.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = `btn ${b.cls}`;
    btn.textContent = b.label;
    btn.onclick = b.action;
    footer.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('visible');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('visible'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

// ── UTILS ─────────────────────────────────────────────────────────────────
async function api(url, method='GET', body=null) {
  const opts = {method, headers:{'Content-Type':'application/json'}, credentials:'same-origin'};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Erreur réseau');
  return data;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function formatDateFr(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${parseInt(d)} ${['','janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][parseInt(m)]} ${y}`;
}

let _toast;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `show ${type}`;
  clearTimeout(_toast);
  _toast = setTimeout(() => el.className = '', 3500);
}
